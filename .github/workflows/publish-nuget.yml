name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_SDK_VERSION: "9.0.306"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish BBDownT
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - name: Ensure release tag
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          project_version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' BBDownT/BBDownT.csproj)
          test -n "$project_version"
          test "$GITHUB_REF_NAME" = "v${project_version}"

      - name: Set up dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Restore
        run: dotnet restore BBDownT.sln

      - name: Build
        run: dotnet build BBDownT.sln -c Release -m:1 --no-restore

      - name: Pack
        run: dotnet pack BBDownT/BBDownT.csproj -c Release -o artifacts --no-build

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: LOVAHE

      - name: Push package
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
