name: CodeQL

on:
  push:
    branches: [v2]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
  pull_request:
    branches: [v2]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.306"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Build for analysis
        run: dotnet build BBDownT.sln -c Release --nologo -p:UseSharedCompilation=false
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
