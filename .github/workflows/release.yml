name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          project_version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' BBDownT/BBDownT.csproj)
          test -n "$project_version"
          test "$GITHUB_REF_NAME" = "v${project_version}"

  build:
    needs: validate-tag
    uses: ./.github/workflows/build_latest.yml

  draft-release:
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="BBDownT ${tag#v}"
          notes="Draft release for ${tag}."
          repo="${GITHUB_REPOSITORY}"

          ls -lah release-assets

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$repo"
            gh release edit "$tag" --draft --title "$title" --notes "$notes" --repo "$repo"
          else
            gh release create "$tag" release-assets/* --draft --title "$title" --notes "$notes" --repo "$repo"
          fi
