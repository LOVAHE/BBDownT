name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    if: github.event_name != 'push' || github.event.forced == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          project_version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' BBDownT/BBDownT.csproj)
          test -n "$project_version"
          test "$GITHUB_REF_NAME" = "v${project_version}"

  build:
    needs: validate-tag
    uses: ./.github/workflows/build_latest.yml

  draft-release:
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          releases=$(gh api --paginate --slurp "repos/${repo}/releases?per_page=100")
          state=$(jq -er --arg tag "$tag" '
            [.[][] | select(.tag_name == $tag)] |
            if length == 0 then "missing"
            elif length == 1 and .[0].draft == true then "draft"
            elif length == 1 and .[0].draft == false then "published"
            else error("ambiguous release metadata") end' <<< "$releases")

          if [[ "$state" == published ]]; then
            echo "Release ${tag} is already published; refusing to change it." >&2
            exit 1
          fi

          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found." >&2
            exit 1
          fi

          if [[ "$state" == draft ]]; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$repo"
          else
            gh release create "$tag" "${assets[@]}" --draft --verify-tag \
              --title "BBDownT ${tag#v}" --notes-from-tag
          fi
