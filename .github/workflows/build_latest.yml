name: Build Latest

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  DOTNET_SDK_VERSION: "9.0.306"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  set-date:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.get_date.outputs.date }}
    steps:
      - name: Ensure release tag
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) exit 1 ;;
          esac

      - name: Get Date in UTC+8
        id: get_date
        run: echo "date=$(date -u -d '8 hours' +'%Y%m%d')" >> "$GITHUB_OUTPUT"

  build-win-x64-arm64:
    runs-on: windows-latest
    needs: set-date

    steps:
      - uses: actions/checkout@v7

      - name: Set up dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Install zip
        run: choco install zip --no-progress --yes

      - name: Publish [win]
        run: |
          dotnet publish BBDownT -r win-x64 -c Release -o artifact
          dotnet publish BBDownT -r win-arm64 -c Release -o artifact-arm64

      - name: Package [win]
        run: |
          cd artifact
          zip ../BBDownT_${{ needs.set-date.outputs.date }}_win-x64.zip BBDownT.exe
          cd ../artifact-arm64
          zip ../BBDownT_${{ needs.set-date.outputs.date }}_win-arm64.zip BBDownT.exe

      - name: Upload Artifact [win-x64]
        uses: actions/upload-artifact@v7
        with:
          name: BBDownT_win-x64
          path: BBDownT_${{ needs.set-date.outputs.date }}_win-x64.zip

      - name: Upload Artifact [win-arm64]
        uses: actions/upload-artifact@v7
        with:
          name: BBDownT_win-arm64
          path: BBDownT_${{ needs.set-date.outputs.date }}_win-arm64.zip

  build-linux-x64-arm64:
    runs-on: ubuntu-latest
    needs: set-date

    steps:
      - uses: actions/checkout@v7
      
      - name: Build x64 in Ubuntu 18.04 container (for glibc 2.27 compatibility)
        run: |
          # 在 Ubuntu 18.04 容器中执行完整构建流程
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:18.04 \
            bash -c "
              set -e
  
              # 安装编译和运行依赖
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y wget build-essential clang libicu-dev zlib1g libcurl4-openssl-dev libkrb5-dev
  
              # 下载并安装 .NET SDK
              DOTNET_SDK_VERSION='${{ env.DOTNET_SDK_VERSION }}'
              DOTNET_SDK_URL=\"https://builds.dotnet.microsoft.com/dotnet/Sdk/\${DOTNET_SDK_VERSION}/dotnet-sdk-\${DOTNET_SDK_VERSION}-linux-x64.tar.gz\"
              wget -nv \"\$DOTNET_SDK_URL\" -O dotnet-sdk.tar.gz
              mkdir -p /opt/dotnet
              tar -xzf dotnet-sdk.tar.gz -C /opt/dotnet
              export PATH=\"/opt/dotnet:\$PATH\"
  
              # 编译 Native AOT 输出到挂载的 artifact 目录
              dotnet publish BBDownT -r linux-x64 -c Release -o /workspace/artifact
            "
      
      - name: Build arm64 in Ubuntu 18.04 container (for glibc 2.27 compatibility)
        run: |
          # 在 Ubuntu 18.04 容器中执行完整构建流程
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-18.04-cross-arm64-20220312201346-b2c2436 \
            bash -c "
              set -e
  
              # 下载并安装 .NET SDK
              DOTNET_SDK_VERSION='${{ env.DOTNET_SDK_VERSION }}'
              DOTNET_SDK_URL=\"https://builds.dotnet.microsoft.com/dotnet/Sdk/\${DOTNET_SDK_VERSION}/dotnet-sdk-\${DOTNET_SDK_VERSION}-linux-x64.tar.gz\"
              wget -nv \"\$DOTNET_SDK_URL\" -O dotnet-sdk.tar.gz
              mkdir -p /opt/dotnet
              tar -xzf dotnet-sdk.tar.gz -C /opt/dotnet
              export PATH=\"/opt/dotnet:\$PATH\"
  
              # 编译 Native AOT 输出到挂载的 artifact 目录
              dotnet publish BBDownT -r linux-arm64 -c Release -p:StripSymbols=true -p:CppCompilerAndLinker=clang-9 -p:SysRoot=/crossrootfs/arm64 -o /workspace/artifact-arm64
            "

      - name: Package [linux]
        run: |
          cd artifact
          zip ../BBDownT_${{ needs.set-date.outputs.date }}_linux-x64.zip BBDownT
          cd ../artifact-arm64
          zip ../BBDownT_${{ needs.set-date.outputs.date }}_linux-arm64.zip BBDownT

      - name: Upload Artifact [linux-x64]
        uses: actions/upload-artifact@v7
        with:
          name: BBDownT_linux-x64
          path: BBDownT_${{ needs.set-date.outputs.date }}_linux-x64.zip

      - name: Upload Artifact[linux-arm64]
        uses: actions/upload-artifact@v7
        with:
          name: BBDownT_linux-arm64
          path: BBDownT_${{ needs.set-date.outputs.date }}_linux-arm64.zip

  build-mac-x64-arm64:
    runs-on: macos-15
    needs: set-date

    steps:
      - uses: actions/checkout@v7

      - name: Set up dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Publish [osx]
        run: |
          dotnet publish BBDownT -r osx-x64 -c Release -o artifact
          dotnet publish BBDownT -r osx-arm64 -c Release -o artifact-arm64

      - name: Package [osx]
        run: |
          cd artifact
          zip ../BBDownT_${{ needs.set-date.outputs.date }}_osx-x64.zip BBDownT
          cd ../artifact-arm64
          zip ../BBDownT_${{ needs.set-date.outputs.date }}_osx-arm64.zip BBDownT

      - name: Upload Artifact [osx-x64]
        uses: actions/upload-artifact@v7
        with:
          name: BBDownT_osx-x64
          path: BBDownT_${{ needs.set-date.outputs.date }}_osx-x64.zip

      - name: Upload Artifact [osx-arm64]
        uses: actions/upload-artifact@v7
        with:
          name: BBDownT_osx-arm64
          path: BBDownT_${{ needs.set-date.outputs.date }}_osx-arm64.zip
