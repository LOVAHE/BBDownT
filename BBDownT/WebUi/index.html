  function rememberPick(part) {
    if (part === 'video') {
      const v = pick.video && parsed.Videos.find((x) => x.Key === pick.video);
      savePref('video', v ? { Qn: v.Id, Quality: v.Quality, Codec: v.Codec } : null);
    } else {
      const a = pick.audio && parsed.Audios.find((x) => x.Id === pick.audio);
      savePref('audio', a ? { Id: a.Id, Label: a.Label, Kind: a.Kind } : null);
    }
  }
  const videoPrefLabel = (p) => [p.Quality || p.Qn, p.Codec].filter(Boolean).join(' ');
  const audioPrefLabel = (p) => p.Label || p.Id;
  // 这次解析不按上次的选择处理的原因，此时不自动选择、点选的流也不记住：
  // resume：从「已下载文件」继续下载旧版本留下的文件夹，要选的是这个文件夹之前下载的流，不是上次的选择；
  // guest：按未登录身份解析，可选画质受限（如未登录时最高 480P），点选的流不代表平时的选择
  function prefHold(r) {
    return isResumeParse(r) ? 'resume' : guestParse(r) ? 'guest' : '';
  }
  // 这次解析按上次的选择处理的结果，用于提示：how 为 exact/codec/lower（已选中）、none（没有同档或更低的流）、
  // skipped（这个视频取消过换选的流）、resume/guest（见 prefHold，不自动选择）
  let prefState = { video: null, audio: null };
  // 没有手动点选时按上次的选择自动选中
  function applyStreamPref(r) {
    prefState = pickByPref(r, pick, loadPref(), prefHold(r), codecOrder($('encoding').value));
  }
  // 上次的选择没能原样选中时的说明（如「上次选择 4K 超清 HEVC 不可用，已选 1080P 高码率 HEVC」）。
  // 默认说明单个链接的结果；多个链接时传入那一行的解析结果、选中的流和 pickByPref 的结果
  function prefHintText(r = parsed, p = pick, st = prefState) {
    if (!r) return '';
    const v = st.video && wantsVideo() && !r.Progressive ? st.video : null;
    const a = st.audio && wantsAudio() ? st.audio : null;
    const hold = prefHold(r);
    if (hold) {
      const held = [v ? videoPrefLabel(v.pref) : '', a ? audioPrefLabel(a.pref) : ''].filter(Boolean).join(' + ');
      const picked = (p.video && wantsVideo() && !r.Progressive) || (p.audio && wantsAudio());
      if (!held && !picked) return '';
      const parts = [];
      if (hold === 'guest') {
        if (held) parts.push(`当前按未登录身份解析，可选画质受限，没有自动选用上次选择的 ${held}`);
        if (picked) parts.push(`${held ? '' : '当前按未登录身份解析，'}点选的流只用于这次下载，不会记作上次的选择`);
      } else {
        if (held) parts.push(`继续下载时不自动选用上次的选择（${held}）`);
        parts.push(picked ? `${held ? '' : '继续下载时'}点选的流只用于这次下载，不会记作上次的选择` : '请选择与这个文件夹之前下载时相同的流');
      }
      return parts.join('；') + '。';
    }
    const parts = [];
    const curV = p.autoVideo && r.Videos.find((x) => x.Key === p.video);
    if (v && (v.how === 'codec' || v.how === 'lower') && curV) parts.push(`上次选择 ${videoPrefLabel(v.pref)} 不可用，已选 ${curV.Quality} ${curV.Codec}`);
    else if (v && v.how === 'none') parts.push(`上次选择 ${videoPrefLabel(v.pref)} 不可用（只有更高的画质），未自动选择`);
    else if (v && v.how === 'skipped' && !p.video) parts.push(`这个视频不自动选择视频流，上次选择的 ${videoPrefLabel(v.pref)} 仍保留`);
    const curA = p.autoAudio && r.Audios.find((x) => x.Id === p.audio);
    if (a && a.how === 'lower' && curA) parts.push(`上次的音频 ${audioPrefLabel(a.pref)} 不可用，已选 ${curA.Label}`);
    else if (a && a.how === 'none') parts.push(`上次的音频 ${audioPrefLabel(a.pref)} 不可用，按默认音频下载`);
    else if (a && a.how === 'skipped' && !p.audio) parts.push(`这个视频不自动选择音频流，上次选择的 ${audioPrefLabel(a.pref)} 仍保留`);
    return parts.length ? parts.join('；') + '。' : '';
  }
  function renderPrefHint() {
    const el = $('prefHint');
    if (!el) return;
    const text = prefHintText();
    el.firstElementChild.textContent = text;
    el.hidden = !text;
  }
  // 读屏软件播报解析状态（结果区整块重绘，不适合直接设 aria-live）
  function announce(text) { $('parseStatus').textContent = text; }

  function parseBody(link, page) {
    const full = buildRequest(cleanLink(link));
    const body = { Url: full.Url };
    ['DfnPriority', 'EncodingPriority', 'AudioOnly', 'VideoOnly', 'SubOnly', 'DanmakuOnly', 'CoverOnly',
      'SelectPage', 'SkipSubtitle', 'UseTvApi', 'UseAppApi', 'UseIntlApi'].forEach((k) => {
      if (full[k] !== undefined) body[k] = full[k];
    });
    if (page) body.Page = page;
    return body;
  }
  function cacheGet(key) {
    const hit = parseCache.get(key);
    if (hit && Date.now() - hit.at < PARSE_CACHE_MS) return hit;
    parseCache.delete(key);
    return null;
  }
  function cachePut(key, entry) {
    parseCache.delete(key);
    parseCache.set(key, { at: Date.now(), ...entry });
    while (parseCache.size > 30) parseCache.delete(parseCache.keys().next().value);
  }

  function scheduleParse() {
    clearTimeout(parseTimer);
    parseTimer = setTimeout(() => { parseTimer = null; doParse({ auto: true }); }, PARSE_DEBOUNCE_MS);
    renderFoot();
  }
  // 接口或画质等选项变化：已有结果时重新解析；否则按自动解析规则处理
  function onParseOptionChange() {
    // 多个链接：选项变了的行重新解析（「下载内容」等也会重绘每一行）
    if (batch.rows.length) { syncBatch(currentLinks()); syncParseState(); return; }
    // 「下载内容」会改变哪些流可选，先按当前结果重绘
    if (parsed && !$('result').hidden) renderParse();
    const links = currentLinks();
    if (!$('result').hidden && links.length) scheduleParse();
    else if ($('autoParse').checked && links.length === 1 && linkKind(links[0]) === 'single') scheduleParse();
    syncParseState();
  }
  function cancelParse() {
    clearTimeout(parseTimer);
    parseTimer = null;
    if (parseCtl) { parseCtl.abort(); parseCtl = null; }
    setParseBusy(false);
  }
  function closeParse() {
    const hadFocus = $('result').contains(document.activeElement);
    cancelParse();
    parsed = null;
    parsedKey = '';
    resetPick();
    $('result').hidden = true;
    $('result').innerHTML = '';
    announce('');
    if (hadFocus) urlBox.focus();
    syncParseState();
  }
  function setParseBusy(busy) {
    $('parseBtn').disabled = busy;
    if (busy) $('parseBtn').innerHTML = '<span class="spin"></span>解析中';
    else $('parseBtn').textContent = '解析';
    renderFoot();
  }
  // kind：loading、error（解析失败）、input（输入有误，如链接无法识别、分P写错）、info（如列表链接）
  function showResultMessage(kind, msg) {
    const r = $('result');
    r.hidden = false;
    r.classList.remove('stale');
    // 服务端的消息可能已带「解析失败：」，这里统一加一次
    const text = String(msg ?? '').replace(/^解析失败[：:]\s*/, '');
    const cls = kind === 'input' ? 'error' : kind;
    r.innerHTML = kind === 'loading'
      ? `<div class="r-meta"><span class="spin"></span> ${esc(text)}</div>`
      : `<div class="r-msg ${cls}"><span>${kind === 'error' ? '解析失败：' : ''}${esc(text)}</span><button class="icon-btn" data-act="close" type="button" title="关闭" aria-label="关闭">${ICON.x}</button></div>`;
    announce(kind === 'loading' ? text : (kind === 'error' ? '解析失败：' : '') + text);
  }
  function showParseError(err) {
    parsed = null;
    parsedKey = '';
    showResultMessage(err.status === 422 ? 'info' : err.status === 400 ? 'input' : 'error', err.message);
    $('page').classList.toggle('invalid', err.status === 400 && /^「分P」/.test(err.message));
  }

  async function doParse(opts = {}) {
    clearTimeout(parseTimer);
    parseTimer = null;
    const links = currentLinks();
    if (!links.length) { if (!opts.auto) toast('请先粘贴链接', true); return; }
    // 多个链接时只解析第一个；所选的流也只用于第一个链接
    const link = links[0];
    const body = parseBody(link, opts.page);
    // 缓存按 linkKey 比较：同一视频的BV号、链接、分享文本共用结果
    const key = JSON.stringify({ ...body, Url: linkKey(link) });
    // 手动点「解析」且结果已经显示时，视为刷新
    const shownSame = !!parsed && key === parsedKey && !$('result').hidden;
    if (!opts.force && !(opts.manual && shownSame)) {
      if (parseCtl && parseCtl.key === key) return;
      if (shownSame) { syncParseState(); return; }
      const hit = cacheGet(key);
      if (hit) {
        cancelParse();
        if (hit.res) applyParse(hit.res, link, key); else showParseError(hit.err);
        syncParseState();
        return;
      }
    }
    cancelParse();
    const ctl = parseCtl = new AbortController();
    ctl.key = key;
    ctl.link = linkKey(link);
    // 这次解析结束（成功、失败或被取消）时完成；提交时用它等解析（settleParse）
    let settle;
    ctl.done = new Promise((resolve) => { settle = resolve; });
    const timer = setTimeout(() => { ctl.timedOut = true; ctl.abort(); }, PARSE_TIMEOUT_MS);
    setParseBusy(true);
    if (!parsed) showResultMessage('loading', '正在解析，通常需要 2~5 秒…');
    try {
      const res = await api('/parse', { method: 'POST', body, signal: ctl.signal });
      cachePut(key, { res });
      if (ctl !== parseCtl) return;
      applyParse(res, link, key);
    } catch (err) {
      if (err instanceof AuthError || ctl !== parseCtl) return;
      if (err.name === 'AbortError' && !ctl.timedOut) return;
      // 链接无法识别、列表链接、分P写错这类结果固定的错误也缓存，避免反复请求
      if (err.status === 400 || err.status === 422) cachePut(key, { err: { status: err.status, message: err.message } });
      showParseError(ctl.timedOut ? { status: 504, message: '解析超时（60 秒），B站接口可能较慢，请稍后重试' } : err);
    } finally {
      clearTimeout(timer);
      if (ctl === parseCtl) { parseCtl = null; setParseBusy(false); }
      syncParseState();
      settle();
    }
  }
  $('parseBtn').addEventListener('click', () => (batch.rows.length ? parseBatchNow() : doParse({ manual: true })));

  function applyParse(res, link, key) {
    const norm = linkKey(link);
    const apiNow = $('api').value;
    if (!(parsed && parsedLink === norm && parsedApi === apiNow)) resetPick();
    parsed = res;
    parsedKey = key;
    parsedLink = norm;
    parsedApi = apiNow;
    // 自动选中的流每次解析重新匹配（如换了分P、改了接口）；手动点选的保留
    if (pick.autoVideo) { pick.video = null; pick.autoVideo = null; }
    if (pick.autoAudio) { pick.audio = null; pick.autoAudio = null; }
    if (res.Progressive || (pick.video && !res.Videos.some((v) => v.Key === pick.video))) pick.video = null;
    if (pick.audio && !res.Audios.some((a) => a.Id === pick.audio)) pick.audio = null;
    if (pick.dub && !res.AudioLanguages.some((l) => l.Code === pick.dub)) pick.dub = '';
    if (!pick.pagesTouched) {
      pick.pages = new Set(res.DownloadPages ? res.DownloadPages : res.Pages.map((p) => p.Index));
    }
    applyStreamPref(res);
    $('page').classList.remove('invalid');
    renderParse();
    announce(`解析完成：${res.Title}，${res.Videos.length} 条视频流，${res.Audios.length} 条音频流`
      + (pick.autoVideo || pick.autoAudio ? '，已按上次的选择自动选中' : ''));
  }

  function syncParseState() {
    const input = currentInput();
    const shown = !!parsed && !$('result').hidden;
    const fresh = isFresh();
    $('result').classList.toggle('stale', shown && !fresh);
    const label = batch.rows.length ? '全部下载' : fresh && effectivePick() ? '下载所选' : '下载';
    // 正在等解析（settleBatch）时按钮上显示进度
    $('submitText').textContent = submitWait || label;
    const footBtn = $('result').querySelector('[data-act="download"]');
    if (footBtn) footBtn.textContent = label;
    renderFoot();
    syncLinkState(input);
  }

  function hintAction(code) {
    if (code === 'app-no-token' || code === 'tv-no-token' || code === 'low-quality') return '<button class="btn small" data-act="web" type="button">改用 WEB 重新解析</button>';
    if (code === 'not-logged-in' || code === 'cookie-invalid') return '<button class="btn small" data-act="login" type="button">扫码登录</button>';
    return '';
  }

  // 音频流按钮：名称（192K、杜比全景声等，认不出时为码率）+ 编码和大小；码率放在 title 里，
  // 名称相同的几条（如 TV 接口的音轨）补上音频流ID以便区分
  function audioPill(a, r, sameLabel, enabled, p = pick) {
    const named = !/kbps$/.test(a.Label);
    const sel = a.Id === p.audio;
    const extra = sameLabel ? ` · ID ${esc(a.Id)}` : '';
    const title = `音频流 ID ${a.Id}${named ? '，标称 ' + a.Label : ''}，B站标注码率 ${a.BandwidthKbps} kbps`;
    return `<button type="button" class="pill${sel ? ' sel' : ''}" data-audio="${esc(a.Id)}" aria-pressed="${sel}" title="${esc(title)}"${enabled ? '' : ' disabled'}>${esc(a.Label)} <small>${esc(a.Codec)}${extra} · ~${fmtBytes(a.Size)}</small>${a.Id === r.DefaultAudio ? '<span class="tag">默认</span>' : ''}${sel ? lastTag(p.autoAudio) : ''}</button>`;
  }
  // 按上次的选择自动选中的流上的标记；手动点选后去掉（updatePickUi）
  function lastTag(how) {
    if (!how) return '';
    const tip = how === 'exact' ? '与上次选择的流相同。再点一次取消，之后不再自动选择'
      : '上次选择的流不可用，按上次的选择选了最接近的。再点一次取消：只是这个视频不选，上次的选择仍保留';
    return `<span class="tag last" title="${esc(tip)}">${how === 'exact' ? '上次选择' : '按上次选择'}</span>`;
  }

  // 视频流表格和音频流按钮；p 为选中的流（单个链接为 pick，多个链接时为那一行的）
  function streamSecs(r, p) {
    const acc = r.Account;
    const videoOn = wantsVideo() && !r.Progressive;
    const audioOn = wantsAudio();
    const content = CONTENT_LABEL[$('content').value];

    // 视频：按画质分行，每行列出可选编码；点一下指定，再点一下取消。合并流只能下载最高画质，只列出、不可点选
    const rows = [];
    const byQ = new Map();
    const hinted = hintedVideo(r);
    for (const v of r.Videos) { if (!byQ.has(v.Id)) byQ.set(v.Id, []); byQ.get(v.Id).push(v); }
    for (const [, list] of byQ) {
      const f = list[0];
      const pills = list.map((v) => {
        const sel = v.Key === p.video;
        const inner = `${esc(v.Codec)} <small>${v.SizeIsEstimate ? '~' : ''}${fmtBytes(v.Size)}${v.BandwidthKbps ? ' · ' + v.BandwidthKbps + ' kbps' : ''}</small>${v.Key === r.DefaultVideo ? '<span class="tag">默认</span>' : ''}${v.Key === hinted ? '<span class="tag" title="与上次未完成的下载大小相近；选它才能沿用已下载的分片">接近上次</span>' : ''}${sel && !r.Progressive ? lastTag(p.autoVideo) : ''}`;
        return r.Progressive
          ? `<span class="pill static">${inner}</span>`
          : `<button type="button" class="pill${sel ? ' sel' : ''}" data-video="${esc(v.Key)}" aria-pressed="${sel}" title="${esc(CODEC_TIP[v.Codec] || '')}"${videoOn ? '' : ' disabled'}>${inner}</button>`;
      }).join('');
      rows.push(`<div class="qrow"><div><b>${esc(f.Quality)}</b></div><div class="res">${esc(f.Resolution || '')}${f.Fps ? ' · ' + esc(String(Math.round(parseFloat(f.Fps)))) + 'fps' : ''}</div><div class="pills">${pills}</div></div>`);
    }
    // 未登录时B站常常不标注 need_login/need_vip，这些档位统一说明为需登录
    const guestWeb = r.Api === 'WEB' && !acc.WebLoggedIn;
    for (const q of r.AcceptQualities.filter((x) => !x.Available)) {
      const why = q.NeedVip ? '需大会员' : q.NeedLogin || guestWeb ? '需登录' : '当前接口未提供';
      rows.push(`<div class="qrow locked"><div>${esc(q.Label)}</div><div class="res">${why}</div><div></div></div>`);
    }
    const videoNote = r.Progressive ? '（合并流，只能下载最高画质）'
      : !wantsVideo() ? `（「下载内容」为「${content}」，不下载视频）` : '（点选可指定，再点一次取消）';
    const videoSec = r.Videos.length
      ? `<div class="sec">视频流 · ${r.Videos.length} 条${videoNote}</div><div class="qtable">${rows.join('')}</div>` : '';
    const labelCount = new Map();
    r.Audios.forEach((a) => labelCount.set(a.Label, (labelCount.get(a.Label) || 0) + 1));
    const audioSec = r.Audios.length
      ? `<div class="sec">音频流${audioOn ? '' : `（「下载内容」为「${content}」，不下载音频）`}</div><div class="pills">${r.Audios.map((a) => audioPill(a, r, labelCount.get(a.Label) > 1, audioOn, p)).join('')}</div>` : '';
    return videoSec + audioSec;
  }

  function renderParse() {
    const r = parsed;
    const acc = r.Account;
    const who = r.Api === 'WEB'
      ? (acc.WebLoggedIn ? `${esc(acc.WebUserName || '已登录')}${acc.IsVip ? '（' + esc(acc.VipLabel || '大会员') + '）' : '（非大会员）'}` : '未登录')
      : r.Api === 'INTL' ? '国际版' : (acc.ApiAuthenticated ? `${r.Api} 凭证已保存` : `${r.Api} 未登录`);
    const hints = r.Hints.map((h) => `<div class="hintbar ${h.Level}"><span>${esc(h.Message)}</span>${hintAction(h.Code)}</div>`).join('');
    const langSec = r.AudioLanguages.length
      ? `<div class="sec"><label for="dubSel">配音</label></div><select id="dubSel" class="dub-sel">${['<option value="">默认音轨</option>', ...r.AudioLanguages.map((l) => `<option value="${esc(l.Code)}">${esc(l.Title)}${l.IsAi ? '（AI）' : ''}</option>`)].join('')}</select>` : '';
    const pageSec = r.PageCount > 1
      ? `<div class="sec">分P · 共 ${r.PageCount} 个<span class="spacer"></span><button class="btn small" data-act="all" type="button">全选</button><button class="btn small" data-act="none" type="button">全不选</button></div>
         <div class="plist">${r.Pages.map((p) => `<div class="prow${p.Index === r.StreamsPage ? ' cur' : ''}"><input type="checkbox" id="pagebox${p.Index}" data-pagebox="${p.Index}"${pick.pages.has(p.Index) ? ' checked' : ''}><label class="pt" for="pagebox${p.Index}">P${p.Index} ${esc(p.Title)}</label><small>${fmtClock(p.Duration)}</small>${p.Index === r.StreamsPage ? '<small class="look-cur">上面的画质来自此P</small>' : `<button class="btn small look" data-pagepick="${p.Index}" type="button" aria-label="查看 P${p.Index} 的画质">看画质</button>`}</div>`).join('')}</div>
         ${$('page').value.trim() ? '<div class="hint">已在上方「分P」中填写，下载时以填写内容为准</div>' : ''}` : '';
    const subSec = r.Subtitles.length ? `<div class="sec">字幕：${r.Subtitles.map((x) => esc(x.Title) + (x.IsAi ? '（AI）' : '')).join('、')}</div>` : '';
    const dur = (r.Pages.find((p) => p.Index === r.StreamsPage) || {}).Duration || 0;
    $('result').hidden = false;
    $('result').innerHTML = `
      <div class="r-head">
        <div class="cover">${coverHtml(r.Pic)}</div>
        <div class="r-main">
          <div class="r-title">${esc(r.Title)}</div>
          <div class="r-meta">${r.OwnerName ? `<span>UP主：${esc(r.OwnerName)}</span>` : ''}<span>${fmtClock(dur)}</span><span>${r.PageCount} 个分P</span>
            <span title="解析耗时 ${esc(String(r.ElapsedMs))} ms">接口：<b>${esc(r.Api)}</b>${r.RequestedApi !== r.Api ? '（已从 ' + esc(r.RequestedApi) + ' 回退）' : ''}</span><span>账号：<b>${who}</b></span></div>
        </div>
        <button class="icon-btn" data-act="close" type="button" title="关闭解析结果（Esc）" aria-label="关闭解析结果">${ICON.x}</button>
      </div>
      ${hints}<div class="hintbar info" id="prefHint" hidden><span></span></div>${streamSecs(r, pick)}${langSec}${pageSec}${subSec}
      <div class="r-foot"><div class="sum" id="pickSum"></div><button class="btn primary" data-act="download" type="button">下载</button></div>`;
    if ($('dubSel')) $('dubSel').value = pick.dub;
    renderPrefHint();
    syncParseState();
  }

  // 点选后只更新按钮状态和底部说明，不重绘整个结果区（保持键盘焦点）
  function updatePickUi() {
    const r = $('result');
    r.querySelectorAll('[data-video]').forEach((b) => {
      const on = b.dataset.video === pick.video;
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', String(on));
    });
    r.querySelectorAll('[data-audio]').forEach((b) => {
      const on = b.dataset.audio === pick.audio;
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', String(on));
    });
    r.querySelectorAll('[data-pagebox]').forEach((box) => { box.checked = pick.pages.has(parseInt(box.dataset.pagebox, 10)); });
    if (!pick.autoVideo) r.querySelectorAll('[data-video] .tag.last').forEach((el) => el.remove());
    if (!pick.autoAudio) r.querySelectorAll('[data-audio] .tag.last').forEach((el) => el.remove());
    renderPrefHint();
    syncParseState();
  }

  // 下载时会用到的、按上次的选择自动选中的流（如「4K 超清 HEVC + 192K」）；没有时为空
  function autoPickLabel() {
    if (!parsed) return '';
    const v = pick.autoVideo && wantsVideo() && !parsed.Progressive && parsed.Videos.find((x) => x.Key === pick.video);
    const a = pick.autoAudio && wantsAudio() && parsed.Audios.find((x) => x.Id === pick.audio);
    return [v ? `${v.Quality} ${v.Codec}` : '', a ? a.Label : ''].filter(Boolean).join(' + ');
  }
  // 底部「已选」后的说明：哪一项是按上次的选择自动选中的（另一项可能只是默认的流），取消后会怎样
  function autoNote(v, a) {
    const autoV = pick.autoVideo && v && v.Key === pick.video && !parsed.Progressive ? pick.autoVideo : null;
    const autoA = pick.autoAudio && a && a.Id === pick.audio ? pick.autoAudio : null;
    if (!autoV && !autoA) return '';
    const what = autoV && autoA ? '' : autoV ? `视频 ${v.Quality} ${v.Codec} ` : `音频 ${a.Label} `;
    const then = [autoV, autoA].filter(Boolean).every((how) => how === 'exact') ? '，之后不再自动选择' : '';
    return `（${what}按上次的选择自动选中；点一下可取消${then}）`;
  }
  // 底部说明：结果过时时说明原因，否则说明下载时会用哪些流
  function renderFoot() {
    const sum = $('pickSum');
    if (!parsed || !sum) return;
    if (!isFresh()) {
      sum.textContent = parseTimer || parseCtl ? '链接或解析接口已变化，正在重新解析…' : '链接或解析接口已变化，请点「解析」更新。';
      return;
    }
    const v0 = wantsVideo(), a0 = wantsAudio();
    const describe = (v, a) => {
      const parts = [];
      if (v) parts.push(`${v.Quality} ${v.Codec}`);
      if (a) parts.push(a.Label);
      const size = (v ? v.Size : 0) + (a ? a.Size : 0);
      return parts.join(' + ') + (size ? `，约 ${fmtBytes(size)}${parsed.PageCount > 1 ? '/P' : ''}` : '');
    };
    const typed = $('page').value.trim();
    const pages = parsed.PageCount > 1
      ? `，${typed ? '分P ' + typed : pick.pagesTouched ? pick.pages.size + ' 个分P' : (parsed.DownloadPages ? parsed.DownloadPages.length : parsed.PageCount) + ' 个分P'}` : '';
    if (!v0 && !a0) {
      sum.textContent = `「下载内容」为「${CONTENT_LABEL[$('content').value]}」，不下载音视频${pages}。`;
      return;
    }
    const find = (key, id) => [v0 ? parsed.Videos.find((x) => x.Key === key) : null, a0 ? parsed.Audios.find((x) => x.Id === id) : null];
    if (effectivePick()) {
      const [v, a] = find(pick.video || parsed.DefaultVideo, pick.audio || parsed.DefaultAudio);
      sum.textContent = `已选：${describe(v, a)}${pages}${autoNote(v, a)}`;
    } else {
      const [v, a] = find(parsed.DefaultVideo, parsed.DefaultAudio);
      const d = describe(v, a);
      sum.textContent = d ? `未指定：「下载」按上方「画质」设置自动选择（${d}${pages}）。${parsed.Progressive ? '' : '点选上面的流可指定。'}` : '';
    }
  }

  $('result').addEventListener('click', (e) => {
    const t = e.target.closest('[data-video],[data-audio],[data-act],[data-pagepick]');
    if (!t || t.disabled) return;
    if (t.dataset.act === 'close') { closeParse(); return; }
    if (!parsed) return;
    // 结果过时（链接或接口已变化）时不能再点选：选择不会用于新的链接
    const picking = t.dataset.video || t.dataset.audio || t.dataset.pagepick || t.dataset.act === 'all' || t.dataset.act === 'none';
    if (picking && !isFresh()) return;
    if (t.dataset.video) {
      togglePick('video', t.dataset.video);
      updatePickUi();
    } else if (t.dataset.audio) {
      togglePick('audio', t.dataset.audio);
      updatePickUi();
    }
    else if (t.dataset.pagepick) doParse({ page: parseInt(t.dataset.pagepick, 10) });
    else switch (t.dataset.act) {
      case 'web': $('api').value = ''; store.set('opt.api', ''); apiMigrationNote = ''; renderApiNote(); doParse(); break;
      case 'login': openBiliLogin(); break;
      case 'all': pick.pages = new Set(parsed.Pages.map((p) => p.Index)); pick.pagesTouched = true; updatePickUi(); break;
      case 'none': pick.pages = new Set(); pick.pagesTouched = true; updatePickUi(); break;
      case 'download': $('taskForm').requestSubmit(); break;
    }
  });
  $('result').addEventListener('change', (e) => {
    if (!isFresh()) {
      // 结果过时：撤销这次改动（键盘仍可能操作到）
      if (e.target.id === 'dubSel') e.target.value = pick.dub; else updatePickUi();
      return;
    }
    if (e.target.id === 'dubSel') { pick.dub = e.target.value; syncParseState(); return; }
    const box = e.target.closest('[data-pagebox]');
    if (box) {
      const i = parseInt(box.dataset.pagebox, 10);
      if (box.checked) pick.pages.add(i); else pick.pages.delete(i);
      pick.pagesTouched = true;
      syncParseState();
    }
  });
  // Esc 关闭解析结果（焦点在结果区内或页面空白处时）
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || $('result').hidden || !$('tokenModal').hidden || !$('biliModal').hidden) return;
    const el = document.activeElement;
    if (!el || el === document.body || $('result').contains(el)) closeParse();
  });

  // 有对应的解析结果、且用户点选过时，按所选的流精确下载；其他分P找不到该流时按画质/编码回退。
  // 什么都没选时与不解析完全相同。
  function pinnedRequest(link) {
    const body = buildRequest(link);
    if (!pinnable(link) || !effectivePick()) return body;
    const v = pick.video && parsed.Videos.find((x) => x.Key === pick.video);
    const a = pick.audio && parsed.Audios.find((x) => x.Id === pick.audio);
    if (v && wantsVideo() && !parsed.Progressive) {
      body.VideoStream = v.Key;
      body.DfnPriority = v.Quality;
      if (CODEC_TIP[v.Codec]) body.EncodingPriority = v.Codec.toLowerCase();
    }
    if (a && wantsAudio()) body.AudioStream = a.Id;
    if (pick.dub) body.AudioLanguage = pick.dub;
    if (pick.pagesTouched && parsed.PageCount > 1 && !body.SelectPage) {
      if (!pick.pages.size) throw new Error('请至少选择一个分P');
      body.SelectPage = pagesExpr(pick.pages, parsed.PageCount);
    }
    return body;
  }

  // ---------- 多个链接：逐个解析的列表 ----------
  // 去重后有两个以上链接、其中有单个视频时（batchPlan），单个视频的链接按输入顺序逐个解析：一次一个，两次请求至少间隔 BATCH_GAP_MS，
  // 与单个链接共用 60 秒缓存；输入或选项变了时取消进行中的请求、只重新解析变了的行。结果一行一个视频列在 #batch 里，
  // 每行写明下载时用的流（按上次的选择自动选中，规则与单个链接相同；否则为按「画质」「视频编码优先」的默认流），
  // 展开后可只为这个视频改选。「全部下载」按行逐个添加任务，每行与单个链接的 pinnedRequest 一样指定选中的流；
  // 解析失败、没解析完的行和列表链接按原方式提交。分P不按行选择，多P视频都按上方「分P」下载
  const BATCH_GAP_MS = 400;
  const BATCH_WAIT_MS = 90000;
  // rows：{ key, link, kind, status, body, reqKey, res, err, api, pick, prefState, open, force }（kind、status 见 batch-rules）。
  // ctl：进行中的解析（一次只有一个）；timer：防抖或间隔的定时器；lastAt：上次请求结束的时间；over：超过 BATCH_MAX 个的视频数；
  // started：点过「解析」（关掉自动解析时也逐个解析）；halted：访问令牌失效，停到下次操作；waiters：等解析的提交（settleBatch）
  const batch = { rows: [], over: 0, ctl: null, timer: null, lastAt: 0, started: false, halted: false, waiters: [] };
  let submitWait = '';   // 等解析时「下载」按钮上的进度
  const newRowPick = () => ({ video: null, audio: null, autoVideo: null, autoAudio: null, skipVideoPref: false, skipAudioPref: false });
  const batchWants = () => ({ video: wantsVideo(), audio: wantsAudio() });
  const batchBusy = () => !batch.halted && batchProgress(batch.rows).pending > 0;
  const batchTick = () => new Promise((resolve) => batch.waiters.push(resolve));

  // 按输入框里的链接更新列表：同一视频、同样请求的行保留结果和选中的流；请求变了（如改了接口、画质）的重新排队。
  // 不是多个链接时收起列表并返回 false
  function syncBatch(links) {
    const plan = batchPlan(links, BATCH_MAX);
    if (!plan.batch) {
      if (batch.rows.length) closeBatch();
      return false;
    }
    const old = new Map(batch.rows.map((r) => [r.key, r]));
    const apiNow = $('api').value;
    const auto = $('autoParse').checked || batch.started;
    batch.rows = plan.rows.map((x) => {
      const row = old.get(x.key) || { key: x.key, reqKey: '', res: null, err: null, api: apiNow, pick: newRowPick(), prefState: { video: null, audio: null }, open: false };
      row.link = x.link;
      row.kind = x.kind;
      if (x.kind !== 'single') {
        Object.assign(row, { status: x.kind, reqKey: '', res: null, err: null, open: false });
        return row;
      }
      const body = parseBody(x.link);
      const reqKey = JSON.stringify({ ...body, Url: x.key });
      if (row.reqKey !== reqKey) {
        row.body = body;
        row.reqKey = reqKey;
        row.status = auto ? 'queued' : 'idle';
        // 单个链接时已解析过这个视频（如又粘贴了别的链接）：沿用结果和选中的流
        if (!row.res && parsed && parsedKey === reqKey && parsedApi === apiNow) {
          Object.assign(row, { res: parsed, api: parsedApi, status: 'done', prefState: { ...prefState } });
          Object.assign(row.pick, { video: pick.video, audio: pick.audio, autoVideo: pick.autoVideo, autoAudio: pick.autoAudio,
            skipVideoPref: pick.skipVideoPref, skipAudioPref: pick.skipAudioPref });
        }
      } else if (row.status === 'idle' && auto) row.status = 'queued';
      return row;
    });
    batch.over = plan.over;
    batch.halted = false;
    // 进行中的解析对应的行已移除，或请求变了：取消
    const ctl = batch.ctl;
    if (ctl && !(batch.rows.includes(ctl.row) && ctl.row.reqKey === ctl.reqKey)) { ctl.abort(); batch.ctl = null; }
    // 缓存里有的直接显示
    for (const row of batch.rows) {
      const hit = row.status === 'queued' && cacheGet(row.reqKey);
      if (hit) finishRow(row, hit.res, hit.err);
    }
    // 收起单个链接的结果区（结果已沿用到对应的行）
    if (parsed || parseCtl || parseTimer || !$('result').hidden) closeParse();
    renderBatch();
    if (nextBatchRow(batch.rows)) batchKick(PARSE_DEBOUNCE_MS);
    return true;
  }
  function closeBatch() {
    clearTimeout(batch.timer);
    batch.timer = null;
    if (batch.ctl) { batch.ctl.abort(); batch.ctl = null; }
    Object.assign(batch, { rows: [], over: 0, started: false, halted: false });
    renderBatch();
    setParseBusy(false);
  }
  function batchKick(delay) {
    clearTimeout(batch.timer);
    batch.timer = setTimeout(() => { batch.timer = null; pumpBatch(); }, delay);
  }
  // 解析下一个排队的行；缓存里有的不发请求
  async function pumpBatch() {
    if (batch.ctl || batch.halted) return;
    let row;
    while ((row = nextBatchRow(batch.rows))) {
      const hit = !row.force && cacheGet(row.reqKey);
      if (!hit) break;
      finishRow(row, hit.res, hit.err);
    }
    if (!row) { renderBatch(); return; }
    const wait = batch.lastAt + BATCH_GAP_MS - Date.now();
    if (wait > 0) { renderBatch(); batchKick(wait); return; }
    clearTimeout(batch.timer);
    batch.timer = null;
    const ctl = batch.ctl = new AbortController();
    ctl.row = row;
    ctl.reqKey = row.reqKey;
    row.status = 'parsing';
    row.force = false;
    renderBatch();
    const timer = setTimeout(() => { ctl.timedOut = true; ctl.abort(); }, PARSE_TIMEOUT_MS);
    let res = null;
    let err = null;
    try {
      res = await api('/parse', { method: 'POST', body: row.body, signal: ctl.signal });
      cachePut(ctl.reqKey, { res });
    } catch (e) {
      err = e;
    } finally {
      clearTimeout(timer);
      batch.lastAt = Date.now();
    }
    // 已被取消（链接或选项变了）：syncBatch/closeBatch 已另行安排
    if (batch.ctl !== ctl) return;
    batch.ctl = null;
    if (err instanceof AuthError) {
      // 访问令牌失效：停下，重新输入令牌后点「解析」或改动输入时继续
      row.status = 'queued';
      batch.halted = true;
      renderBatch();
      return;
    }
    if (!err) finishRow(row, res, null);
    else {
      // 与单个链接相同：链接无法识别、列表链接、分P写错这类结果固定的错误也缓存
      if (err.status === 400 || err.status === 422) cachePut(ctl.reqKey, { err: { status: err.status, message: err.message } });
      finishRow(row, null, ctl.timedOut ? { status: 504, message: '解析超时（60 秒），B站接口可能较慢' } : err);
    }
    renderBatch();
    if (nextBatchRow(batch.rows)) batchKick(BATCH_GAP_MS);
    else {
      const prog = batchProgress(batch.rows);
      announce(`已解析 ${prog.done - prog.failed} 个视频${prog.failed ? `，${prog.failed} 个失败` : ''}`);
    }
  }
  function finishRow(row, res, err) {
    if (res) { applyRowParse(row, res); return; }
    row.status = 'failed';
    row.open = false;
    row.err = { status: err.status, message: String(err.message ?? '').replace(/^解析失败[：:]\s*/, '') };
  }
  // 与单个链接的 applyParse 相同：同一接口重新解析时保留点选的流，自动选中的按上次的选择重新匹配
  function applyRowParse(row, res) {
    const apiNow = $('api').value;
    if (row.api !== apiNow) row.pick = newRowPick();
    Object.assign(row, { api: apiNow, res, err: null, status: 'done' });
    const p = row.pick;
    if (p.autoVideo) { p.video = null; p.autoVideo = null; }
    if (p.autoAudio) { p.audio = null; p.autoAudio = null; }
    if (res.Progressive || (p.video && !res.Videos.some((v) => v.Key === p.video))) p.video = null;
    if (p.audio && !res.Audios.some((a) => a.Id === p.audio)) p.audio = null;
    row.prefState = pickByPref(res, p, loadPref(), prefHold(res), codecOrder($('encoding').value));
  }
  // 点「解析」：开始逐个解析（关掉自动解析时也会），失败的重试；都已解析时全部重新解析（不用缓存）
  function parseBatchNow() {
    batch.started = true;
    batch.halted = false;
    const singles = batch.rows.filter((r) => r.kind === 'single');
    const todo = singles.filter((r) => r.status !== 'done' && r.status !== 'parsing');
    (todo.length ? todo : singles).forEach((r) => {
      if (r.status === 'parsing') return;
      r.force = !todo.length || r.status === 'failed';
      r.status = 'queued';
    });
    clearTimeout(batch.timer);
    batch.timer = null;
    pumpBatch();
    syncParseState();
  }
  // 改「画质」或「视频编码优先」：与单个链接相同，取消各行选中的视频流，按新的设置重新解析
  function clearBatchVideoPicks() {
    let n = 0;
    for (const row of batch.rows) {
      if (row.pick.video) n++;
      Object.assign(row.pick, { video: null, autoVideo: null, skipVideoPref: false });
      row.prefState.video = null;
    }
    return n;
  }
  // 在某一行点选或取消：只用于这个视频，不记作上次的选择；取消后这个视频按默认的流下载，重新解析时也不再自动选择（'all'）
  function toggleRowPick(row, part, value) {
    const p = row.pick;
    p[part] = p[part] === value ? null : value;
    p[part === 'video' ? 'autoVideo' : 'autoAudio'] = null;
    const pref = loadPref()[part];
    if (p[part]) row.prefState[part] = null;
    else {
      p[part === 'video' ? 'skipVideoPref' : 'skipAudioPref'] = 'all';
      row.prefState[part] = pref && !prefHold(row.res) ? { pref, how: 'skipped' } : null;
    }
  }
  // 移除一行：输入框改成剩下的链接（一行一个），列表随之更新；只剩一个链接时回到单个链接的解析
  function removeBatchRow(row) {
    const i = batch.rows.indexOf(row);
    urlBox.value = batch.rows.filter((r) => r !== row).map((r) => r.link).join('\n');
    urlBox.dispatchEvent(new Event('input'));
    const next = batch.rows.length ? $('batch').querySelectorAll('[data-act="remove"]')[Math.min(i, batch.rows.length - 1)] : null;
    (next || urlBox).focus();
  }
  function batchNoteText() {
    const n = batch.rows.length;
    let text = $('autoParse').checked || batch.started
      ? `识别到 ${n} 个链接：逐个解析，结果见下方列表；点「全部下载」按每行写明的流逐个添加任务。`
      : `识别到 ${n} 个链接：已关闭自动解析，点「解析」逐个解析；点「全部下载」逐个添加任务。`;
    if (batch.over) text += `单个视频超过 ${BATCH_MAX} 个，只解析前 ${BATCH_MAX} 个，其余 ${batch.over} 个按「画质」等设置下载。`;
    return text;
  }

  // 一行的封面、文字和展开后的流表格
  function batchRowParts(row, wants) {
    const r = row.res;
    const meta = [];
    if (r && r.OwnerName) meta.push(`<span>UP主：${esc(r.OwnerName)}</span>`);
    if (r) meta.push(`<span>${fmtClock((r.Pages.find((pg) => pg.Index === r.StreamsPage) || {}).Duration || 0)}</span>`);
    if (r && r.PageCount > 1) {
      const n = r.DownloadPages ? r.DownloadPages.length : 0;
      meta.push(`<span>共 ${r.PageCount} 个分P，按上方「分P」设置下载${n ? (n === r.PageCount ? '全部' : `其中 ${n} 个`) : ''}</span>`);
    }
    const st = {
      idle: '<span class="b-st">未解析（点「解析」开始）</span>',
      queued: `<span class="b-st">${r ? '排队重新解析' : '排队解析'}</span>`,
      parsing: `<span class="b-st"><span class="spin"></span>${r ? '重新解析中' : '解析中'}</span>`,
      done: '<span class="b-st">已解析</span>',
      failed: row.err ? `<span class="b-st ${row.err.status === 422 ? 'note' : 'failed'}">${row.err.status === 422 ? '' : '解析失败：'}${esc(row.err.message)}；下载时按「画质」等设置</span>` : '',
      list: '<span class="b-st note">列表链接，按原方式下载</span>',
      unknown: '<span class="b-st note">认不出的链接，不解析，下载时交给服务器判断</span>',
      over: `<span class="b-st note">超过 ${BATCH_MAX} 个，不解析，按「画质」等设置下载</span>`,
    }[row.status] || '';
    let stream = '';
    let hint = '';
    if (row.status === 'done') {
      const s = rowStreams(r, row.pick, wants);
      const tag = (how) => (how === 'default' ? '' : how === 'manual' ? '<span class="tag">已选</span>'
        : `<span class="tag last" title="${how === 'exact' ? '与上次选择的流相同' : '上次选择的流不可用，按上次的选择选了最接近的'}">${how === 'exact' ? '上次选择' : '按上次选择'}</span>`);
      const names = [];
      if (s.video) names.push(`${esc(s.video.Quality)} ${esc(s.video.Codec)}${tag(s.videoHow)}`);
      if (s.audio) names.push(`${esc(s.audio.Label)}${tag(s.audioHow)}`);
      const size = (s.video ? s.video.Size : 0) + (s.audio ? s.audio.Size : 0);
      const picked = s.videoHow !== 'default' || s.audioHow !== 'default';
      const what = !wants.video && !wants.audio ? `「下载内容」为「${esc(CONTENT_LABEL[$('content').value])}」，不下载音视频`
        : names.length ? `将下载：${names.join(' + ')}${size ? `，约 ${fmtBytes(size)}${r.PageCount > 1 ? '/P' : ''}` : ''}${picked ? '' : '（按「画质」设置自动选择）'}`
        : '没有可下载的音视频流';
      const canPick = (wants.video && !r.Progressive && r.Videos.length) || (wants.audio && r.Audios.length);
      stream = `<div class="b-stream"><span>${what}</span>${canPick || row.open
        ? `<button class="btn small" data-act="expand" type="button" aria-expanded="${row.open}">${row.open ? '收起' : '选择流'}</button>` : ''}</div>`;
      hint = prefHintText(r, row.pick, row.prefState);
    }
    const main = `<div class="b-top"><div class="b-title" title="${esc(r ? r.Title : row.link)}">${esc(r ? r.Title : shortLink(row.link))}</div>`
      + `<button class="icon-btn" data-act="remove" type="button" title="移除这个链接" aria-label="移除这个链接">${ICON.x}</button></div>`
      + `<div class="r-meta">${meta.join('')}${st}</div>${stream}${hint ? `<div class="hint">${esc(hint)}</div>` : ''}`;
    const panel = row.open && row.status === 'done'
      ? r.Hints.map((h) => `<div class="hintbar ${h.Level}"><span>${esc(h.Message)}</span>${hintAction(h.Code)}</div>`).join('')
        + streamSecs(r, row.pick) + '<div class="hint">在这里点选的流只用于这个视频，不会记作上次的选择。</div>'
      : '';
    return { cover: coverHtml(r && r.Pic), main, panel };
  }
  // 按行保留元素、只改变化的部分（封面不闪）；焦点在某一行的按钮上时，重绘后放回同一个按钮
  const batchItemHtml = new WeakMap();
  function renderBatch() {
    const box = $('batch');
    const rows = batch.rows;
    const waiters = batch.waiters;
    batch.waiters = [];
    waiters.forEach((resolve) => resolve());
    if (!rows.length) {
      box.hidden = true;
      box.innerHTML = '';
      return;
    }
    if (box.hidden || !box.firstElementChild) {
      box.innerHTML = '<div class="b-head"></div><div class="b-list"></div>'
        + '<div class="r-foot"><div class="sum"></div><button class="btn primary" data-act="download" type="button">全部下载</button></div>';
      box.hidden = false;
    }
    const prog = batchProgress(rows);
    const busy = prog.pending > 0 && !batch.halted;
    const head = `<b>${rows.length} 个链接</b>`
      + (prog.total ? `<span class="b-st">${busy ? '<span class="spin"></span>' : ''}已解析 ${prog.done}/${prog.total}${prog.failed ? `，${prog.failed} 个失败` : ''}</span>` : '')
      + (batch.halted ? '<span>访问令牌失效，输入令牌后点「解析」继续</span>' : '');
    if (box.firstElementChild.innerHTML !== head) box.firstElementChild.innerHTML = head;

    const active = document.activeElement;
    let refocus = null;
    if (active && box.contains(active) && active.closest('.b-item')) {
      const attr = ['video', 'audio', 'act'].find((k) => active.dataset[k] !== undefined);
      if (attr) refocus = { key: active.closest('.b-item').dataset.key, attr, value: active.dataset[attr] };
    }
    const list = box.querySelector('.b-list');
    const wants = batchWants();
    const existing = new Map([...list.children].map((el) => [el.dataset.key, el]));
    let prev = null;
    for (const row of rows) {
      let el = existing.get(row.key);
      existing.delete(row.key);
      if (!el) {
        el = document.createElement('div');
        el.className = 'b-item';
        el.dataset.key = row.key;
        el.innerHTML = '<div class="b-row"><div class="cover"></div><div class="b-main"></div></div><div class="b-panel" hidden></div>';
        batchItemHtml.set(el, {});
      }
      const parts = batchRowParts(row, wants);
      const last = batchItemHtml.get(el);
      if (last.cover !== parts.cover) { el.querySelector('.cover').innerHTML = parts.cover; last.cover = parts.cover; }
      if (last.main !== parts.main) { el.querySelector('.b-main').innerHTML = parts.main; last.main = parts.main; }
      if (last.panel !== parts.panel) {
        const panel = el.querySelector('.b-panel');
        panel.innerHTML = parts.panel;
        panel.hidden = !parts.panel;
        last.panel = parts.panel;
      }
      const want = prev ? prev.nextElementSibling : list.firstElementChild;
      if (want !== el) list.insertBefore(el, want);
      prev = el;
    }
    existing.forEach((el) => el.remove());
    if (refocus && !box.contains(document.activeElement)) {
      const item = [...list.children].find((el) => el.dataset.key === refocus.key);
      const t = item && item.querySelector(`[data-${refocus.attr}="${CSS.escape(refocus.value)}"]`);
      if (t) t.focus();
    }

    const pref = loadPref();
    const notes = [];
    if (prog.failed) notes.push(`解析失败的 ${prog.failed} 个按「画质」等设置下载`);
    if (busy && (pref.video || pref.audio)) notes.push('还没解析完的会先等解析完成，以便按上次的选择下载');
    box.querySelector('.r-foot .sum').textContent = `点「全部下载」逐个添加 ${rows.length} 个任务${notes.length ? '；' + notes.join('；') : ''}。`;
    const btn = busy ? `<span class="spin"></span>解析中 ${prog.done}/${prog.total}` : '解析';
    if ($('parseBtn').innerHTML !== btn) $('parseBtn').innerHTML = btn;
    $('parseBtn').disabled = busy;
  }
  $('batch').addEventListener('click', (e) => {
    const t = e.target.closest('[data-video],[data-audio],[data-act]');
    if (!t || t.disabled) return;
    const act = t.dataset.act;
    if (act === 'download') { $('taskForm').requestSubmit(); return; }
    if (act === 'login') { openBiliLogin(); return; }
    if (act === 'web') {
      $('api').value = '';
      store.set('opt.api', '');
      apiMigrationNote = '';
      renderApiNote();
      onParseOptionChange();
      return;
    }
    const item = t.closest('.b-item');
    const row = item && batch.rows.find((r) => r.key === item.dataset.key);
    if (!row) return;
    if (act === 'remove') { if (!submitting) removeBatchRow(row); return; }
    if (act === 'expand') row.open = !row.open;
    else if (row.status !== 'done') return;
    else if (t.dataset.video) toggleRowPick(row, 'video', t.dataset.video);
    else if (t.dataset.audio) toggleRowPick(row, 'audio', t.dataset.audio);
    renderBatch();
  });

  // ---------- 多个链接：全部下载 ----------
  // 记住了上次选择的流、还有行在排队或正在解析时，先等这些解析完成（最多 BATCH_WAIT_MS）：只有解析结果才能把上次的选择
  // 对应到这个视频的流。超时没解析完的照常按「画质」等设置提交。没有记住的选择时不等，没解析的行本来就按「画质」等设置下载
  async function settleBatch() {
    const pref = loadPref();
    if ((!pref.video && !pref.audio) || !batchBusy()) return { waited: false, timedOut: false };
    // 还在防抖或间隔：马上开始
    if (batch.timer) { clearTimeout(batch.timer); batch.timer = null; pumpBatch(); }
    const deadline = Date.now() + BATCH_WAIT_MS;
    while (batchBusy()) {
      const left = deadline - Date.now();
      if (left <= 0) break;
      const prog = batchProgress(batch.rows);
      submitWait = `等待解析 ${prog.done}/${prog.total}…`;
      $('submitText').textContent = submitWait;
      let timer;
      await Promise.race([batchTick(), new Promise((resolve) => { timer = setTimeout(resolve, left); })]);
      clearTimeout(timer);
    }
    return { waited: true, timedOut: batchBusy() };
  }
  async function submitBatch(links, ignored) {
    let wait = { waited: false, timedOut: false };
    // 等解析时不能改输入框，提交的仍是按下「下载」时的链接
    urlBox.readOnly = true;
    try {
      wait = await settleBatch();
    } finally {
      urlBox.readOnly = false;
      submitWait = '';
      syncParseState();
    }
    // 等待期间输入框被换掉了（如在「已下载文件」里点了继续下载）：不提交旧的链接
    if (wait.waited && currentLinks().map(linkKey).join('\n') !== links.map(linkKey).join('\n')) return;
    const wants = batchWants();
    const rows = batch.rows.slice();
    let ok = 0;
    let auto = 0;
    let parseFailed = 0;
    let unparsed = 0;
    const failed = [];
    const errors = [];
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      try {
        await api('/add-task', { method: 'POST', body: batchRowRequest(buildRequest(row.link), row, wants) });
        ok++;
        if (row.status === 'failed') parseFailed++;
        else if (row.kind === 'single' && row.status !== 'done') unparsed++;
        else if (row.status === 'done') {
          const s = rowStreams(row.res, row.pick, wants);
          if (![s.videoHow, s.audioHow].every((how) => how === 'default' || how === 'manual')) auto++;
        }
      } catch (err) {
        if (err instanceof AuthError) { failed.push(...rows.slice(i).map((r) => r.link)); break; }
        failed.push(row.link);
        errors.push(`${err.message}（${shortLink(row.link)}）`);
      }
    }
    // 添加失败的链接留在输入框里，列表随之更新
    if (ok || failed.length < rows.length) {
      urlBox.value = failed.join('\n');
      urlBox.dispatchEvent(new Event('input'));
    }
    if (errors.length) {
      showFormMsg(errors.join('\n'));
      if (errors.some((x) => x.startsWith('「分P」'))) $('page').classList.add('invalid');
    }
    if (ignored.length) {
      $('linkNote').textContent = `上次输入中有文字不是链接或编号，已忽略、没有提交：${describeIgnored(ignored)}。`;
      $('linkNote').hidden = false;
    }
    if (ok) {
      resumeTarget = null;
      resumeHint = null;
      const notes = [];
      if (auto) notes.push(`${auto} 个按上次的选择下载`);
      if (parseFailed) notes.push(`${parseFailed} 个解析失败，按「画质」等设置下载`);
      if (unparsed && wait.timedOut) notes.push(`${unparsed} 个等了 ${BATCH_WAIT_MS / 1000} 秒还没解析完，按「画质」等设置下载，没有用上次选择的流`);
      toast((errors.length ? `已添加 ${ok} 个，${errors.length} 个失败（原因见输入框下方）` : `已添加 ${ok} 个任务`)
        + (notes.length ? `。其中 ${notes.join('；')}` : ''), false, notes.length ? 6000 : undefined);
      switchTab('tasks');
      refreshTasks();
    }
  }

  // ---------- tabs ----------
  let activeTab = 'tasks';
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === tab));
    $('tasksPane').hidden = tab !== 'tasks';
    $('filesPane').hidden = tab !== 'files';
    $('historyPane').hidden = tab !== 'history';
    $('clearDone').hidden = tab !== 'tasks';
    $('clearHistory').hidden = tab !== 'history';
    syncTaskTools();
    if (tab === 'files') refreshFiles();
    if (tab === 'history') refreshHistory();
  }
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => switchTab(t.dataset.tab)));

  // ---------- tasks ----------
  let lastTasks = null;
  let finishedIds = new Set();
  function taskCard(t, state) {
    // 标题获取到之前显示BV号或链接
    const title = t.Title || shortLink(t.Url);
    let badge = '';
    if (state === 'pending') badge = '<span class="badge pending">排队中</span>';
    else if (state === 'running') badge = '<span class="badge running">下载中</span>';
    else if (t.IsSuccessful) badge = '<span class="badge done">已完成</span>';
    else badge = '<span class="badge failed">失败</span>';

    const meta = [];
    if (state === 'running') {
      meta.push(`<span>${(t.Progress * 100).toFixed(1)}%</span>`);
      if (t.DownloadSpeed > 0) meta.push(`<span>${fmtBytes(t.DownloadSpeed)}/s</span>`);
      if (t.TotalDownloadedBytes > 0) meta.push(`<span>已下载 ${fmtBytes(t.TotalDownloadedBytes)}</span>`);
    } else if (state === 'finished') {
      if (t.TaskFinishTime) meta.push(`<span>${fmtTime(t.TaskFinishTime)} 完成</span>`);
      if (t.TaskFinishTime && t.TaskCreateTime) meta.push(`<span>耗时 ${fmtDuration(Math.max(0, t.TaskFinishTime - t.TaskCreateTime))}</span>`);
      if (t.IsSuccessful && t.TotalDownloadedBytes > 0) meta.push(`<span>${fmtBytes(t.TotalDownloadedBytes)}</span>`);
    } else {
      meta.push(`<span>${fmtTime(t.TaskCreateTime)} 添加</span>`);
    }
    if (!t.Title && state === 'running') meta.push('<span>正在获取标题…</span>');
    if (title !== t.Url) meta.push(`<span class="src">${esc(t.Url)}</span>`);

    let progress = '';
    if (state === 'running') {
      const pct = Math.max(0, Math.min(100, t.Progress * 100));
      progress = `<div class="progress${pct === 0 ? ' indeterminate' : ''}"><div style="width:${pct}%"></div></div>`;
    }
    const err = t.Error ? `<div class="err">${esc(t.Error)}</div>` : '';
    const streams = (t.Streams || []).length ? `<div class="streams">${t.Streams.slice(0, 3).map(esc).join('<br>')}${t.Streams.length > 3 ? `<br>… 共 ${t.Streams.length} 个分P` : ''}</div>` : '';
    const outputs = (t.SavePaths || []).map((p, i) => {
      const ext = extOf(p);
      const icon = VIDEO_EXT.includes(ext) ? ICON.film : AUDIO_EXT.includes(ext) ? ICON.music : ICON.file;
      const href = `/files/download?task=${encodeURIComponent(t.TaskId)}&index=${i}`;
      return `<a class="out" href="${href}" download title="下载 ${esc(baseName(p))}">${icon}<span>${esc(baseName(p))}</span></a>`;
    }).join('');
    // 排队中（还没开始）的任务可以取消；正在下载的任务不能取消
    const actions = state === 'finished'
      ? `<button class="icon-btn" data-remove="${esc(t.TaskId)}" type="button" title="移除记录（不删除文件）">${ICON.x}</button>`
      : state === 'pending'
        ? `<button class="btn small" data-cancel="${esc(t.TaskId)}" type="button" title="从队列中移除这个任务，不会下载">取消排队</button>`
        : '';
    return {
      cover: coverHtml(t.Pic),
      main: `<div class="task-head"><div class="task-title" title="${esc(title)}">${esc(title)}</div>${badge}<div class="task-actions">${actions}</div></div>
        <div class="meta">${meta.join('')}</div>
        ${streams}${progress}${err}
        ${outputs ? `<div class="outputs">${outputs}</div>` : ''}`,
    };
  }
  // 下载中每次轮询都会变的只有文字和进度条：按任务保留卡片，只改变化的部分。
  // 整个列表重写 innerHTML 会让封面图片被删掉重建，每刷新一次就闪一下。
  const taskCardHtml = new WeakMap();
  let pendingCount = 0;
  // 「清空排队」只在任务页、有两个以上排队中的任务时显示（只有一个时用卡片上的「取消排队」）
  function syncTaskTools() {
    $('clearPending').hidden = activeTab !== 'tasks' || pendingCount < 2;
  }
  function renderTasks(c) {
    const finished = [...c.Finished].sort((a, b) => (b.TaskFinishTime || 0) - (a.TaskFinishTime || 0));
    const items = [
      ...c.Running.map((t) => [t, 'running']),
      ...c.Pending.map((t) => [t, 'pending']),
      ...finished.map((t) => [t, 'finished']),
    ];
    pendingCount = c.Pending.length;
    syncTaskTools();
    $('taskCount').textContent = items.length ? String(items.length) : '';
    const list = $('taskList');
    if (!items.length) {
      list.innerHTML = `<div class="card empty">${ICON.inbox}<p>还没有任务，粘贴链接开始下载吧</p></div>`;
      return;
    }
    list.querySelectorAll(':scope > .empty').forEach((el) => el.remove());
    const existing = new Map([...list.querySelectorAll(':scope > .card.task[data-id]')].map((el) => [el.dataset.id, el]));
    let prev = null;
    for (const [t, state] of items) {
      const id = String(t.TaskId);
      let el = existing.get(id);
      existing.delete(id);
      if (!el) {
        el = document.createElement('div');
        el.className = 'card task';
        el.dataset.id = id;
        el.innerHTML = '<div class="cover"></div><div class="task-main"></div>';
        taskCardHtml.set(el, {});
      }
      const card = taskCard(t, state);
      const last = taskCardHtml.get(el);
      if (last.cover !== card.cover) { el.firstElementChild.innerHTML = card.cover; last.cover = card.cover; }
      if (last.main !== card.main) { el.lastElementChild.innerHTML = card.main; last.main = card.main; }
      const want = prev ? prev.nextElementSibling : list.firstElementChild;
      if (want !== el) list.insertBefore(el, want);
      prev = el;
    }
    existing.forEach((el) => el.remove());
  }
  $('taskList').addEventListener('click', async (e) => {
    const cancel = e.target.closest('[data-cancel]');
    if (cancel) {
      if (cancel.disabled) return;
      // 成功时按钮保持禁用，直到刷新后卡片移除（否则这期间再点一次会再发一次取消，提示「已不在队列里」）
      cancel.disabled = true;
      try {
        await api('/remove-pending/' + encodeURIComponent(cancel.dataset.cancel), { method: 'DELETE' });
        toast('已取消排队');
      } catch (err) {
        // 卡片按内容是否变化重绘：失败时内容不变、按钮不会被重建，要自己恢复可用
        cancel.disabled = false;
        if (!(err instanceof AuthError)) {
          // 409：队列恰好在这时开始执行它，或者它已经结束（服务器的消息写明是哪一种）；404：已不在队列里（如已被取消）
          toast(err.status === 409 ? err.message || '任务已开始，无法取消' : err.status === 404 ? '这个任务已不在队列里' : err.message, true);
        }
      }
      refreshTasks().catch(() => {});
      return;
    }
    const btn = e.target.closest('[data-remove]');
    if (!btn) return;
    await api('/remove-finished/' + encodeURIComponent(btn.dataset.remove), { method: 'DELETE' }).catch(() => {});
    refreshTasks();
  });
  $('clearPending').addEventListener('click', async () => {
    if (!confirm(`取消全部 ${pendingCount} 个排队中的任务？正在下载的任务不受影响。`)) return;
    try {
      const r = await api('/remove-pending/', { method: 'DELETE' });
      toast(`已取消 ${(r && r.Removed) || 0} 个排队中的任务`);
    } catch (err) {
      if (!(err instanceof AuthError)) toast(err.message, true);
    }
    refreshTasks().catch(() => {});
  });
  $('clearDone').addEventListener('click', async () => {
    await api('/remove-finished/', { method: 'DELETE' }).catch(() => {});
    refreshTasks();
  });

  async function refreshTasks() {
    const c = await api('/get-tasks/');
    const json = JSON.stringify(c);
    if (json !== lastTasks) {
      lastTasks = json;
      renderTasks(c);
    }
    // 有任务完成时刷新文件列表
    const ids = new Set(c.Finished.map((t) => t.TaskId));
    const hasNew = [...ids].some((id) => !finishedIds.has(id));
    finishedIds = ids;
    if (hasNew && filesLoaded) refreshFiles();
    if (hasNew && hist.loaded) refreshHistory();
    return c.Running.length + c.Pending.length > 0;
  }

  // ---------- files ----------
  // 已下载文件按视频分组（GET /files/groups）：一次完成的下载一组（视频和同名的字幕、弹幕、封面；多P文件夹整个一组），
  // 中断的下载（临时文件夹里的分片）一组，可以继续下载或整组删除。
  // 与任务列表一样按组保留卡片、只改变化的部分，刷新时封面不会闪
  let fileGroups = [];
  let filesTruncated = false;
  let filesLoaded = false;
  let filesAt = 0;
  let filesSeq = 0;
  let filesJson = '';
  let titleRetry = 0;
  let titleTimer = null;
  // 用户展开的组（按组 Id），刷新后保持；搜索时匹配的组自动展开，搜索期间手动收起的记在 closedInSearch
  const openGroups = new Set();
  const closedInSearch = new Set();
  let lastFileKw = '';
  let fileEmptyHtml = null;
  const fileGroupHtml = new WeakMap();
  function fileUrl(path, inline) {
    return '/files/download?path=' + encodeURIComponent(path) + (inline ? '&inline=1' : '');
  }
  const fileKind = (p) => VIDEO_EXT.includes(extOf(p)) ? 'video' : AUDIO_EXT.includes(extOf(p)) ? 'audio' : '';
  function pathHtml(path) {
    const slash = path.lastIndexOf('/');
    return `<span class="file-dir">${esc(slash >= 0 ? path.slice(0, slash + 1) : '')}</span>${esc(path.slice(slash + 1))}`;
  }
  // 合并分片或混流中断留下的隐藏暂存文件（.<名>.<32位十六进制>.partial.mp4）
  const isStagedFile = (p) => /^\..+\.[0-9a-f]{32}\.partial(\.[^.]*)?$/.test(baseName(p));
  // inWork：未完成的下载里的文件，不能单独删除（下载会用到它们；要删就删除整组）
  function fileRow(f, inWork) {
    const ext = extOf(f.Path);
    const staged = isStagedFile(f.Path);
    const kind = staged ? '' : fileKind(f.Path);
    const icon = kind === 'video' ? ICON.film : kind === 'audio' ? ICON.music : ICON.file;
    const playable = kind || (!staged && IMAGE_EXT.includes(ext));
    return `<div class="file">
        <div class="file-icon ${kind}">${icon}</div>
        <div class="file-main">
          <div class="file-name">${pathHtml(f.Path)}</div>
          <div class="file-meta">${fmtBytes(f.Size)} · ${fmtTime(f.ModifiedTime)}${staged ? ' · 合并中断留下的临时文件' : ''}</div>
        </div>
        <div class="file-actions">
          ${playable ? `<a class="icon-btn" href="${fileUrl(f.Path, true)}" target="_blank" rel="noopener" title="在线播放/预览">${ICON.play}</a>` : ''}
          <a class="icon-btn" href="${fileUrl(f.Path)}" download title="${inMacApp ? '在访达中显示' : '下载到本机'}">${ICON.down}</a>
          ${inWork ? '' : `<button class="icon-btn" data-del="${esc(f.Path)}" type="button" title="从服务器删除">${ICON.trash}</button>`}
        </div>
      </div>`;
  }
  // 本地封面（下载时保存的 .jpg）：没有B站封面链接或B站封面加载失败时使用
  function localCoverHtml(path) {
    const src = fileUrl(path, true);
    return failedCovers.has(src) ? ICON.film : `<img src="${esc(src)}" alt="" loading="lazy">`;
  }
  // 引擎固定的分片大小（20 MiB）。旧版本留下的文件夹没有记下上次的请求：按视频分片估算上次的视频大小，
  // 重新解析后标出大小相近的视频流，方便选回同一个流（选对了才能沿用已下载的分片）
  const CLIP_BYTES = 20 * 1024 * 1024;
  function lastVideoSize(g) {
    const clips = (g.Clips || []).filter((c) => c.Track === 'video');
    if (!clips.length) return null;
    const page = Math.min(...clips.map((c) => c.Page || 0));
    const last = clips.filter((c) => (c.Page || 0) === page).reduce((a, c) => (c.Index > a.Index ? c : a));

    }
    actions.push(`<button class="btn small" data-redo="${esc(h.Id)}" type="button" title="按这次的解析接口、画质和下载内容重新添加任务">重新下载</button>`);
    if (linkKind(redoUrl(h)) === 'single') {
      actions.push(`<button class="btn small" data-reparse="${esc(h.Id)}" type="button" title="把链接填入输入框并解析，可重新选择画质">重新解析</button>`);
    }
    return `<div class="card task hist">
      <div class="cover">${coverHtml(h.Pic)}</div>
      <div class="task-main">
        <div class="task-head">${head}${badges}<div class="task-actions"><button class="icon-btn" data-hdel="${esc(h.Id)}" type="button" title="删除记录（不删除文件）" aria-label="删除记录">${ICON.x}</button></div></div>
        <div class="meta">${meta.join('')}</div>
        ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
        ${err}
        ${outputs ? `<div class="outputs">${outputs}</div>` : ''}
      </div>
      <div class="hist-actions">${actions.join('')}</div>
    </div>`;
  }
  function renderHistory() {
    $('historyCount').textContent = hist.total ? String(hist.total) : '';
    $('clearHistory').disabled = !hist.total;
    $('historyMore').hidden = hist.next >= hist.matched;
    if (!hist.items.length) {
      $('historyList').innerHTML = hist.q
        ? `<div class="card empty">${ICON.inbox}<p>没有匹配的记录</p></div>`
        : `<div class="card empty">${ICON.inbox}<p>还没有下载历史</p><p class="hint">下载完成或失败的任务会记录在这里，服务重启后也会保留</p></div>`;
      return;
    }
    $('historyList').innerHTML = hist.items.map(historyCard).join('');
  }
  async function refreshHistory(opts = {}) {
    const seq = ++histSeq;
    const q = $('historySearch').value.trim();
    const more = !!opts.more && q === hist.q;
    // 刷新时保留已加载的条数，避免列表变短、滚动位置跳动
    const offset = more ? hist.next : 0;
    const limit = more ? HISTORY_PAGE : Math.max(HISTORY_PAGE, q === hist.q ? hist.items.length : 0);
    try {
      const res = await api(`/history/?q=${encodeURIComponent(q)}&offset=${offset}&limit=${limit}`);
      if (seq !== histSeq) return;
      // 两页之间有新记录插到最前面时，下一页开头会是已加载过的记录：按 Id 去掉重复的
      const seen = new Set(more ? hist.items.map((h) => h.Id) : []);
      const items = more ? hist.items.concat(res.Items.filter((h) => !seen.has(h.Id))) : res.Items;
      // 内容没变时不重绘（保留焦点和悬停状态）；「几分钟前」每分钟最多更新一次
      const json = JSON.stringify([res.Total, res.Matched, offset + res.Items.length, items, Math.floor(Date.now() / 60000)]);
      Object.assign(hist, { items, total: res.Total, matched: res.Matched, next: offset + res.Items.length, q, loaded: true, at: Date.now() });
      if (json === hist.json) return;
      hist.json = json;
      renderHistory();
    } catch (err) {
      if (!(err instanceof AuthError) && seq === histSeq && activeTab === 'history') toast(err.message, true);
    }
  }
  const findHistory = (id) => hist.items.find((h) => h.Id === id);
  $('historySearch').addEventListener('input', () => {
    clearTimeout(histTimer);
    histTimer = setTimeout(() => refreshHistory(), 250);
  });
  $('refreshHistory').addEventListener('click', () => refreshHistory());
  $('historyMoreBtn').addEventListener('click', () => refreshHistory({ more: true }));
  $('clearHistory').addEventListener('click', async () => {
    if (!confirm(`清空全部 ${hist.total} 条下载历史？只删除记录，已下载的文件不会被删除。`)) return;
    try {
      await api('/history/', { method: 'DELETE' });
      toast('已清空下载历史');
    } catch (err) {
      if (!(err instanceof AuthError)) toast(err.message, true);
    }
    refreshHistory();
  });
  $('historyList').addEventListener('click', async (e) => {
    const t = e.target.closest('[data-hdel],[data-redo],[data-reparse]');
    if (!t || t.disabled) return;
    const h = findHistory(t.dataset.hdel || t.dataset.redo || t.dataset.reparse);
    if (!h) return;
    const name = h.Title || shortLink(h.Url);
    if (t.dataset.hdel) {
      if (!confirm(`删除「${name}」的下载记录？已下载的文件不会被删除。`)) return;
      try {
        await api('/history/' + encodeURIComponent(h.Id), { method: 'DELETE' });
      } catch (err) {
        if (err instanceof AuthError) return;
        if (err.status !== 404) toast(err.message, true);
      }
      refreshHistory();
    } else if (t.dataset.redo) {
      // 引擎发现输出的 MP4 已存在时直接跳过（默认文件名不含画质），这次下载什么也不会变；只下音频的 M4A 会重新下载并覆盖
      const kept = (h.Files || []).filter((f) => f.Exists && extOf(f.Path) === 'mp4');
      if (kept.length && !confirm(`「${name}」的视频文件还在下载目录里，重新下载会直接跳过（不覆盖，也不换画质）。要换画质重新下载，请先在「已下载文件」里删除原文件。\n\n仍要重新添加任务？`)) return;
      t.disabled = true;
      try {
        await api('/add-task', { method: 'POST', body: h.Request && h.Request.Url ? h.Request : { Url: h.Url } });
        toast('已重新添加任务：' + name);
        switchTab('tasks');
        refreshTasks().catch(() => {});
      } catch (err) {
        if (!(err instanceof AuthError)) toast(err.message, true);
      } finally {
        t.disabled = false;
      }
    } else {
      // 填入链接并解析：按当前的画质、接口等设置列出可选的流
      urlBox.value = redoUrl(h);
      urlBox.dispatchEvent(new Event('input'));
      window.scrollTo({ top: 0, behavior: 'smooth' });
      urlBox.focus({ preventScroll: true });
      doParse({ manual: true });
    }
  });

  // ---------- polling ----------
  let pollTimer = null;
  let polling = false;
  function stopPolling() {
    polling = false;
    clearTimeout(pollTimer);
  }
  async function poll() {
    if (!polling) return;
    let busy = false;
    try {
      busy = await refreshTasks();
    } catch (err) {
      if (err instanceof AuthError) return;
    }
    // UP主空间批量下载逐个视频写入历史：查看历史时每隔几秒刷新
    if (busy && activeTab === 'history' && Date.now() - hist.at > 5000) refreshHistory();
    // 查看已下载文件时，下载中的视频（临时文件夹里的分片）每隔几秒更新一次
    if (busy && activeTab === 'files' && Date.now() - filesAt > 5000) refreshFiles();
    if (!polling) return;
    pollTimer = setTimeout(poll, document.hidden ? 10000 : busy ? 1200 : 4000);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && polling) { clearTimeout(pollTimer); poll(); }
  });

  async function start() {
    try {
      await loadStatus();
    } catch (err) {
      if (err instanceof AuthError) return;
      toast('无法连接服务器：' + err.message, true);
    }
    refreshFiles();
    refreshHistory();
    stopPolling();
    polling = true;
    poll();
  }
  switchTab('tasks');
  syncParseState();
  start();
})();
</script>
</body>
</html>
