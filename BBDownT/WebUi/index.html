<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>BBDownT 下载器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='19' rx='5' fill='%23fb7299'/%3E%3Cpath d='M10 3l4 4M22 3l-4 4' stroke='%23fb7299' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M16 12v8m-3.5-3.5L16 20l3.5-3.5' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --border: #e3e5e7;
  --text: #18191c;
  --text-2: #61666d;
  --text-3: #9499a0;
  --pink: #fb7299;
  --pink-soft: #fff0f4;
  --blue: #00aeec;
  --blue-soft: #e6f7fd;
  --green: #2bb673;
  --green-soft: #e8f8ef;
  --red: #f25d59;
  --red-soft: #fdeeee;
  --amber: #f2a33a;
  --amber-soft: #fef5e7;
  /* 用作文字时的深色版本，浅色背景上对比度不低于 4.5:1 */
  --amber-text: #a35600;
  --red-text: #c62f2b;
  --pink-text: #c8325f;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111214;
    --surface: #1b1c1f;
    --surface-2: #232428;
    --border: #2e3035;
    --text: #e7e8ea;
    --text-2: #a5a9b0;
    --text-3: #747982;
    --pink-soft: #3a2029;
    --blue-soft: #10303c;
    --green-soft: #15301f;
    --red-soft: #3a1d1c;
    --amber-soft: #3a2c15;
    --amber-text: #f2a33a;
    --red-text: #f25d59;
    --pink-text: #fb7299;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 48px; }

/* header */
header {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
}
.bar { max-width: 960px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: .2px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand small { font-weight: 400; color: var(--text-3); font-size: 12px; }
.spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; white-space: nowrap; font-size: 13px;
  min-width: 0;
}
.chip:hover { border-color: var(--pink); }
#biliText { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.chip.ok .dot { background: var(--green); }
.chip.warn .dot { background: var(--amber); }
.icon-btn { border: 0; background: transparent; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--text-2); display: inline-flex; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.composer { padding: 18px; margin-top: 4px; }
.url-row { display: flex; gap: 10px; align-items: stretch; }
textarea.url {
  flex: 1; min-height: 46px; max-height: 160px; resize: vertical;
  padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--surface-2); outline: none; line-height: 1.5;
}
textarea.url:focus { border-color: var(--pink); background: var(--surface); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 18px; min-height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; white-space: nowrap; font-weight: 500;
}
.btn:hover { border-color: var(--text-3); }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.primary:disabled { opacity: .6; cursor: default; }
.btn.small { min-height: 30px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
a.btn { text-decoration: none; color: inherit; }
.btn.danger { color: var(--red); }
.btn.danger:hover { border-color: var(--red); }
.btn.danger:disabled { opacity: .5; cursor: default; border-color: var(--border); }
.btn svg { width: 16px; height: 16px; }
.url-row .btn.primary { min-width: 108px; }
.url-row .btn.parse { min-width: 84px; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.api-note { font-size: 12px; color: var(--text-2); margin-top: 6px; }
.api-note.warn { color: var(--amber-text); }
.page-chips { display: flex; gap: 4px; margin-top: 4px; }
.page-chips button { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; font-size: 12px; padding: 1px 8px; cursor: pointer; color: var(--text-2); }
.page-chips button:hover { border-color: var(--pink); color: var(--pink); }

/* parse result */
.result { margin-top: 12px; padding: 16px 18px; }
.result.stale { opacity: .55; }
/* 过时的结果不能再点选（选择不会用于新的链接） */
.result.stale .qtable, .result.stale .pills, .result.stale .plist, .result.stale .dub-sel { pointer-events: none; }
.r-head { display: flex; gap: 14px; align-items: flex-start; }
.r-head .cover { width: 120px; }
.r-main { flex: 1; min-width: 0; }
.r-title { font-weight: 600; font-size: 15px; word-break: break-all; }
.r-meta { font-size: 12px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; }
.r-meta b { color: var(--text); font-weight: 500; }
.hintbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-top: 10px; }
.hintbar span { flex: 1 1 220px; }
.hintbar.warn { background: var(--amber-soft); }
.hintbar.info { background: var(--blue-soft); }
.sec { font-size: 12px; color: var(--text-2); margin: 14px 0 6px; display: flex; gap: 8px; align-items: center; }
.sec .spacer { flex: 1; }
.qtable { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.qrow { display: grid; grid-template-columns: 116px 132px 1fr; gap: 10px; align-items: center; padding: 7px 12px; border-top: 1px solid var(--border); font-size: 13px; }
.qrow:first-child { border-top: 0; }
.qrow .res { color: var(--text-2); font-size: 12px; white-space: nowrap; }
.qrow.locked { color: var(--text-2); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--border); border-radius: 8px; padding: 3px 10px; background: var(--surface); cursor: pointer; font-size: 12px; display: inline-flex; gap: 6px; align-items: baseline; color: var(--text); }
.pill small { color: var(--text-2); font-size: 12px; }
.pill:hover { border-color: var(--text-3); }
.pill.sel { border-color: var(--pink); background: var(--pink-soft); color: var(--pink-text); }
.pill.sel small { color: var(--pink-text); }
.pill:disabled { opacity: .5; cursor: not-allowed; }
.pill.static { cursor: default; }
.pill.static:hover, .pill:disabled:hover { border-color: var(--border); }
.pill .tag { font-size: 11px; padding: 0 4px; border-radius: 4px; background: var(--surface-2); color: var(--text-2); }
/* 按上次的选择自动选中的流 */
.pill .tag.last { background: var(--surface); color: var(--pink-text); }
.plist { max-height: 210px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
.prow { display: flex; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--border); align-items: center; font-size: 13px; }
.prow:first-child { border-top: 0; }
.prow .pt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.prow.cur .pt { color: var(--pink-text); font-weight: 600; }
.prow small { color: var(--text-2); }
.prow .look { min-height: 24px; padding: 0 8px; font-size: 12px; }
.prow .look-cur { font-size: 12px; }
.r-foot { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.r-foot .sum { flex: 1; min-width: 200px; color: var(--text-2); font-size: 13px; }
.r-msg { display: flex; gap: 10px; align-items: flex-start; border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.r-msg span { flex: 1; word-break: break-all; }
.r-msg .icon-btn { padding: 2px; }
.r-msg.error { color: var(--red-text); background: var(--red-soft); }
.r-msg.info { background: var(--blue-soft); }
.dub-sel { height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); padding: 0 8px; }
/* 多个链接：逐个解析的结果列表，一行一个视频 */
.b-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 13px; color: var(--text-2); }
.b-head b { color: var(--text); font-size: 15px; font-weight: 600; }
.b-head .spin { width: 12px; height: 12px; }
.b-list { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; }
.b-item { border-top: 1px solid var(--border); }
.b-item:first-child { border-top: 0; }
.b-row { display: flex; gap: 12px; padding: 10px 12px; align-items: flex-start; }
.b-row .cover { width: 96px; }
.b-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.b-top { display: flex; gap: 6px; align-items: flex-start; }
.b-title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
.b-top .icon-btn { padding: 2px; flex: none; }
.b-st { display: inline-flex; align-items: center; gap: 4px; }
.b-st .spin { width: 11px; height: 11px; }
.b-st.failed { color: var(--red-text); }
.b-st.note { color: var(--amber-text); }
.b-stream { font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.b-stream .tag { font-size: 11px; padding: 0 4px; margin-left: 4px; white-space: nowrap; border-radius: 4px; background: var(--surface-2); color: var(--text-2); }
.b-stream .tag.last { background: var(--pink-soft); color: var(--pink-text); }
.b-stream .btn.small { min-height: 26px; padding: 0 10px; font-size: 12px; }
.b-panel { padding: 0 12px 12px; }
.b-panel > .sec:first-child { margin-top: 4px; }
.link-note { font-size: 12px; color: var(--text-2); margin-top: 6px; }
.form-msg { margin-top: 8px; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: var(--red-text); background: var(--red-soft); white-space: pre-line; word-break: break-all; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.task .streams { font-size: 12px; color: var(--text-2); }

.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.field select, .field input[type=text], .field input[type=number], .field input[type=password] {
  width: 100%; height: 36px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-2); outline: none;
}
.field select:focus, .field input:focus { border-color: var(--pink); }
.field input.invalid { border-color: var(--red); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.toggle {
  position: relative;
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
  border-radius: 999px; border: 1px solid var(--border); cursor: pointer; user-select: none;
  font-size: 13px; color: var(--text-2);
}
/* 视觉上隐藏、但仍可用 Tab 选中和用空格切换 */
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.toggle:has(input:focus-visible) { outline: 2px solid var(--pink); outline-offset: 2px; }
.toggle:has(input:checked) { background: var(--pink-soft); border-color: var(--pink); color: var(--pink-text); }
.toggle:has(input:disabled) { opacity: .5; cursor: not-allowed; }
details.adv { margin-top: 12px; }
details.adv summary { cursor: pointer; color: var(--text-2); font-size: 13px; list-style: none; display: inline-flex; align-items: center; gap: 4px; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 16px; line-height: 1; }
details.adv[open] summary::before { transform: rotate(90deg); }
.adv-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
.hint { font-size: 12px; color: var(--text-2); margin-top: 4px; }

/* tabs */
.tabs { display: flex; align-items: center; gap: 4px; margin: 22px 0 10px; }
.tab {
  border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; cursor: pointer;
  color: var(--text-2); font-weight: 500;
}
.tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.tab .count { margin-left: 4px; font-size: 12px; color: var(--text-3); }
.tab.active .count { color: var(--pink); }

/* tasks */
.list { display: flex; flex-direction: column; gap: 10px; }
.task { display: flex; gap: 14px; padding: 14px; }
.cover {
  width: 132px; aspect-ratio: 16 / 10; flex: none; border-radius: 10px; overflow: hidden;
  background: var(--surface-2); display: grid; place-items: center; color: var(--text-3);
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover svg { width: 32px; height: 32px; }
.task-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.task-head { display: flex; gap: 8px; align-items: flex-start; }
.task-title { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
.badge { flex: none; font-size: 12px; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
.badge.pending { background: var(--surface-2); color: var(--text-2); }
.badge.running { background: var(--blue-soft); color: var(--blue); }
.badge.done { background: var(--green-soft); color: var(--green); }
.badge.failed { background: var(--red-soft); color: var(--red); }
.meta { font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta span { white-space: nowrap; }
.meta .src { white-space: normal; word-break: break-all; }
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--pink)); border-radius: 99px; transition: width .4s ease; }
.progress.indeterminate > div { width: 30% !important; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.err { font-size: 12px; color: var(--red); background: var(--red-soft); padding: 6px 10px; border-radius: 8px; word-break: break-all; }
.outputs { display: flex; flex-wrap: wrap; gap: 6px; }
.out {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  font-size: 12px; padding: 3px 10px; border-radius: 6px; background: var(--surface-2);
  text-decoration: none; color: var(--text-2); border: 1px solid transparent;
}
.out:hover { border-color: var(--pink); color: var(--pink); }
.out span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.out svg { width: 13px; height: 13px; flex: none; }
.task-actions { display: flex; gap: 6px; }
.task-actions .btn.small { min-height: 26px; padding: 0 10px; }
.task-actions .btn:disabled { opacity: .5; cursor: default; }

.list-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.list-tools .search { flex: 1; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); outline: none; }
.list-tools .search:focus { border-color: var(--pink); }
.files-note { margin: 0 0 10px; }

/* files：组展开后的文件行 */
.file { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border); }
.file:first-child { border-top: 0; }
.file-icon { width: 34px; height: 34px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.file-icon svg { width: 18px; height: 18px; }
.file-icon.video { background: var(--pink-soft); color: var(--pink); }
.file-icon.audio { background: var(--blue-soft); color: var(--blue); }
.file-main { flex: 1; min-width: 0; }
.file-name { word-break: break-all; }
.file-dir { color: var(--text-3); }
.file-meta { font-size: 12px; color: var(--text-3); }
.file-actions { display: flex; gap: 2px; flex: none; }

/* file groups：一个视频一组 */
.fgroup { overflow: hidden; }
.fg-row { display: flex; gap: 12px; align-items: center; padding: 12px 14px; }
.fg-row .cover { width: 96px; }
.fg-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fg-toggle {
  display: flex; flex-direction: column; gap: 4px; align-items: stretch; width: 100%; min-width: 0;
  padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; border-radius: 6px;
}
.fg-toggle:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }
.fg-title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
.fg-toggle:hover .fg-title { color: var(--pink-text); }
.fg-pending { font-weight: 400; font-size: 12px; color: var(--text-3); margin-left: 4px; }
.fg-meta { font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.fg-meta span { white-space: nowrap; }
.fg-more { display: inline-flex; align-items: center; gap: 2px; color: var(--text-2); }
.fg-more::after { content: "›"; display: inline-block; transition: transform .15s; font-size: 15px; line-height: 1; }
.fgroup.open .fg-more::after { transform: rotate(90deg); }
.fg-sub { font-size: 12px; color: var(--text-2); word-break: break-all; }
.fg-actions { display: flex; flex-wrap: wrap; gap: 6px; flex: none; justify-content: flex-end; }
.fg-actions .btn:disabled { opacity: .5; cursor: not-allowed; }
.fg-body { border-top: 1px solid var(--border); }
.badge.partial { background: var(--amber-soft); color: var(--amber-text); }
.clips { padding: 10px 14px 12px; border-top: 1px solid var(--border); }
.fg-body > .clips:first-child { border-top: 0; }
.clips-head { font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.clip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 4px 12px; max-height: 280px; overflow-y: auto; }
.clip { display: flex; gap: 6px; font-size: 12px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.clip .idx { color: var(--text-3); min-width: 3.4em; }
.clip .st { color: var(--green); }
.clip.part .st { color: var(--amber-text); }

/* history */
a.task-title { color: inherit; text-decoration: none; }
a.task-title:hover { color: var(--pink-text); text-decoration: underline; text-underline-offset: 3px; }
.badge.gone { background: var(--surface-2); color: var(--text-2); }
.badge.skipped { background: var(--amber-soft); color: var(--amber-text); }
.hist-badges { display: flex; flex: none; gap: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tags span { font-size: 12px; line-height: 18px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); }
.tags span.api { background: var(--blue-soft); color: var(--blue); }
.out.missing { text-decoration: line-through; opacity: .6; cursor: default; }
.out.missing:hover { border-color: transparent; color: var(--text-2); }
/* 操作按钮单独一行：电脑上与文字对齐，手机上占满整行 */
.task.hist { flex-wrap: wrap; align-items: flex-start; row-gap: 10px; }
.hist-actions { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 0 100%; padding-left: 146px; }
.hist-actions .btn:disabled { opacity: .5; cursor: not-allowed; }
.hist-actions .btn:disabled:hover { border-color: var(--border); }
.more { display: flex; justify-content: center; margin-top: 12px; }
.file-sub { font-size: 12px; color: var(--text-2); word-break: break-all; }

.empty { text-align: center; padding: 48px 16px; color: var(--text-3); }
.empty svg { width: 44px; height: 44px; opacity: .6; }
.empty p { margin: 8px 0 0; }

/* modal */
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { width: 100%; max-width: 380px; padding: 24px; text-align: center; }
.modal h2 { margin: 0 0 6px; font-size: 18px; }
.modal p { margin: 0 0 16px; color: var(--text-2); font-size: 13px; }
.modal .field { text-align: left; margin-bottom: 12px; }
.modal .btn { width: 100%; }
.modal .row { display: flex; gap: 8px; margin-top: 8px; }
.qr { width: 200px; height: 200px; margin: 4px auto 14px; border-radius: 12px; background: #fff; padding: 8px; display: grid; place-items: center; position: relative; }
.qr img { width: 100%; height: 100%; image-rendering: pixelated; }
.qr .over { position: absolute; inset: 0; background: rgba(255,255,255,.92); border-radius: 12px; display: grid; place-items: center; color: #18191c; font-weight: 600; }
.qr-state { min-height: 22px; font-size: 14px; }
.qr-state.ok { color: var(--green); }
.form-err { color: var(--red); font-size: 13px; min-height: 20px; margin-bottom: 8px; }

/* toast */
.toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: max-content; max-width: calc(100vw - 32px); }
.toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.18); animation: pop .2s ease; }
.toast.error { background: var(--red); color: #fff; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

footer { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 28px; }

@media (max-width: 760px) {
  .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .brand small { display: none; }
  .url-row { flex-direction: column; }
  /* 纵向排列时 flex:1 会让输入框忽略脚本设置的高度 */
  textarea.url { flex: none; }
  .url-row .btn.primary { min-height: 42px; }
  .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .qrow { grid-template-columns: 1fr; gap: 4px; }
  .r-head .cover { width: 88px; }
  .b-row { gap: 10px; padding: 10px; }
  .b-row .cover { width: 72px; }
  .b-panel { padding: 0 10px 10px; }
  /* 画质、下载内容并排；分P（提示文字较长）和解析接口各占一行 */
  .opts .field:nth-child(3), .opts .field:last-child { grid-column: span 2; }
  .adv-body { grid-template-columns: 1fr; }
  .task { gap: 10px; padding: 12px; }
  .cover { width: 88px; }
  .cover svg { width: 24px; height: 24px; }
  .task-title { font-size: 14px; }
  /* 排队中的任务：「取消排队」换到标题下一行，标题不会被挤得只剩几个字 */
  .task-head:has([data-cancel]) { flex-wrap: wrap; row-gap: 6px; }
  .task-head:has([data-cancel]) .task-actions { flex-basis: 100%; }
  .chip .label-long { display: none; }
  .chip { max-width: 45vw; }
  .tabs { flex-wrap: wrap; row-gap: 6px; }
  .hist-actions { padding-left: 0; }
  /* 已下载文件：操作按钮换到下一行，标题不会被挤窄 */
  .fg-row { flex-wrap: wrap; align-items: flex-start; gap: 10px; padding: 12px; }
  .fg-row .cover { width: 72px; }
  .fg-actions { flex-basis: 100%; justify-content: flex-start; }
  .fg-title { font-size: 14px; }
  .clip-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  /* 徽标换到标题下一行：第一行只有标题和删除按钮，标题不会被挤得只剩几个字 */
  .task.hist .task-head { flex-wrap: wrap; row-gap: 4px; }
  .hist-badges { order: 1; flex-basis: 100%; flex-wrap: wrap; }
  .tab { padding: 8px 10px; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="19" rx="5" fill="#fb7299"/><path d="M10 3l4 4M22 3l-4 4" stroke="#fb7299" stroke-width="2.5" stroke-linecap="round"/><path d="M16 12v8m-3.5-3.5L16 20l3.5-3.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>BBDownT</span><small id="version"></small>
    </div>
    <div class="spacer"></div>
    <button class="chip" id="biliChip" type="button" hidden><span class="dot"></span><span id="biliText">B站账号</span></button>
    <button class="icon-btn" id="logoutBtn" type="button" title="退出网页登录" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <form class="card composer" id="taskForm" autocomplete="off">
    <div class="url-row">
      <textarea class="url" id="url" rows="1" placeholder="粘贴视频链接、分享文本或 BV/av/ep/ss 号，多个可换行" required></textarea>
      <button class="btn parse" id="parseBtn" type="button" title="先查看这个视频有哪些画质、编码和音轨">解析</button>
      <button class="btn primary" id="submitBtn" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m-5-5 5 5 5-5M5 20h14"/></svg>
        <span id="submitText">下载</span>
      </button>
    </div>
    <div class="link-note" id="linkNote" hidden></div>
    <div class="form-msg" id="formMsg" role="alert" hidden></div>
    <div class="opts">
      <div class="field">
        <label for="quality">画质</label>
        <select id="quality" data-save>
          <option value="">最高画质</option>
          <option value="4K 超清,1080P 高码率,1080P 高帧率,1080P 高清">4K</option>
          <option value="1080P 高码率,1080P 高帧率,1080P 高清,720P 高清">1080P</option>
          <option value="720P 高帧率,720P 高清,480P 清晰">720P</option>
          <option value="480P 清晰,360P 流畅">480P</option>
        </select>
      </div>
      <div class="field">
        <label for="content">下载内容</label>
        <select id="content" data-save>
          <option value="">视频（含音频）</option>
          <option value="audio">仅音频</option>
          <option value="video">仅视频画面</option>
          <option value="sub">仅字幕</option>
          <option value="danmaku">仅弹幕</option>
          <option value="cover">仅封面</option>
        </select>
      </div>
      <div class="field">
        <label for="page">分P</label>
        <input type="text" id="page" placeholder="默认：链接中的P或全部">
        <div class="page-chips"><button type="button" data-page="ALL">全部</button><button type="button" data-page="LAST">最新</button><button type="button" data-page="">清空</button></div>
      </div>
      <div class="field">
        <label for="api">解析接口（下载源）</label>
        <select id="api" data-save>
          <option value="">WEB 网页端（推荐）</option>
          <option value="tv">TV 端（需单独登录）</option>
          <option value="app">APP 端（需单独登录）</option>
          <option value="intl">国际版（东南亚）</option>
        </select>
      </div>
    </div>
    <div class="api-note" id="apiNote"></div>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="subtitle" data-save checked>字幕</label>
      <label class="toggle"><input type="checkbox" id="aiSub" data-save>无人工字幕时用AI字幕</label>
      <label class="toggle"><input type="checkbox" id="danmaku" data-save>弹幕</label>
      <label class="toggle"><input type="checkbox" id="cover" data-save checked>内嵌封面</label>
    </div>
    <details class="adv">
      <summary>高级选项</summary>
      <div class="adv-body">
        <div class="field">
          <label for="encoding">视频编码优先</label>
          <select id="encoding" data-save>
            <option value="">自动</option>
            <option value="hevc,avc,av1">HEVC (H.265)</option>
            <option value="avc,hevc,av1">AVC (H.264，兼容性最好)</option>
            <option value="av1,hevc,avc">AV1</option>
          </select>
        </div>
        <div class="field">
          <label class="toggle" style="margin-top:20px"><input type="checkbox" id="autoParse" data-save checked>粘贴链接后自动解析</label>
        </div>
        <div class="field">
          <label for="filePattern">单P文件名</label>
          <input type="text" id="filePattern" data-save placeholder="&lt;videoTitle&gt;">
        </div>
        <div class="field">
          <label for="multiFilePattern">多P文件名</label>
          <input type="text" id="multiFilePattern" data-save placeholder="&lt;videoTitle&gt;/[P&lt;pageNumberWithZero&gt;]&lt;pageTitle&gt;">
        </div>
        <div class="field">
          <label class="toggle" style="margin-top:20px"><input type="checkbox" id="downloadAll" disabled>UP主空间链接：下载全部投稿</label>
          <div class="hint" id="downloadAllHint">只对 space.bilibili.com/数字 形式的UP主空间链接生效；不勾选时只导出视频清单（TXT）。下载多P视频的全部分P请用上面的「分P → 全部」。</div>
        </div>
        <div class="field">
          <label for="delayPerVideo">投稿之间间隔（秒）</label>
          <input type="number" id="delayPerVideo" data-save min="0" value="10">
        </div>
      </div>
    </details>
  </form>

  <section class="card result" id="result" aria-label="解析结果" hidden></section>
  <section class="card result batch" id="batch" aria-label="多个链接的解析结果" hidden></section>
  <div class="sr-only" id="parseStatus" role="status" aria-live="polite"></div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="tasks" type="button">任务<span class="count" id="taskCount"></span></button>
    <button class="tab" data-tab="files" type="button">已下载文件<span class="count" id="fileCount"></span></button>
    <button class="tab" data-tab="history" type="button">历史<span class="count" id="historyCount"></span></button>
    <div class="spacer"></div>
    <button class="btn small" id="clearPending" type="button" title="取消全部还没开始的任务（正在下载的不受影响）" hidden>清空排队</button>
    <button class="btn small" id="clearDone" type="button">清除已完成</button>
    <button class="btn small danger" id="clearHistory" type="button" title="删除全部下载记录（不删除文件）" hidden>清空历史</button>
  </div>

  <section id="tasksPane">
    <div class="list" id="taskList"></div>
  </section>

  <section id="filesPane" hidden>
    <div class="list-tools">
      <input class="search" id="fileSearch" type="search" placeholder="搜索标题或文件名">
      <button class="btn small" id="refreshFiles" type="button">刷新</button>
    </div>
    <div class="hintbar warn files-note" id="fileNote" hidden><span>文件太多，只显示了最新的一部分；较早的文件没有列出，整组删除也只删除列出的文件。</span></div>
    <div class="list" id="fileList"></div>
    <div class="card empty" id="fileEmpty" hidden></div>
  </section>

  <section id="historyPane" hidden>
    <div class="list-tools">
      <input class="search" id="historySearch" type="search" placeholder="搜索标题、UP主或 BV 号">
      <button class="btn small" id="refreshHistory" type="button">刷新</button>
    </div>
    <div class="list" id="historyList"></div>
    <div class="more" id="historyMore" hidden><button class="btn small" id="historyMoreBtn" type="button">加载更多</button></div>
  </section>

  <footer>任务列表保存在内存中，服务重启后会清空；下载历史保存在数据目录，重启后仍在。清除任务或删除历史记录都不会删除已下载的文件。</footer>
</div>

<div class="mask" id="tokenModal" hidden>
  <form class="card modal" id="tokenForm">
    <h2>输入访问令牌</h2>
    <p>令牌在服务器的 .env 文件或启动日志中</p>
    <div class="field"><input type="password" id="tokenInput" placeholder="API Token" autocomplete="current-password" required></div>
    <div class="form-err" id="tokenErr"></div>
    <button class="btn primary" type="submit">进入</button>
  </form>
</div>

<div class="mask" id="biliModal" hidden>
  <div class="card modal">
    <h2>登录哔哩哔哩</h2>
    <p>登录后可下载 1080P 及以上画质和会员内容</p>
    <div class="qr"><img id="qrImg" alt="" hidden><div class="over" id="qrOver" hidden></div></div>
    <div class="qr-state" id="qrState">正在获取二维码…</div>
    <div class="row">
      <button class="btn" id="qrRefresh" type="button">刷新二维码</button>
      <button class="btn" id="qrClose" type="button">关闭</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // 封面：B站图床（*.hdslb.com）的图片取缩略图，其他地址（如国际版的封面）原样使用；
  // 加载失败（地址失效、被内容安全策略拦截等）时换成图标，之后不再请求
  const failedCovers = new Set();
  function coverUrl(pic) {
    if (!pic) return '';
    const src = String(pic).replace(/^\/\//, 'https://').replace(/^http:/, 'https:');
    let x;
    try { x = new URL(src); } catch { return ''; }
    if (x.protocol !== 'https:') return '';
    const host = x.hostname.toLowerCase();
    return host === 'hdslb.com' || host.endsWith('.hdslb.com') ? src + '@320w_200h_1c.webp' : src;
  }
  // fallback：B站封面加载失败时改用的本地图片地址（已下载文件里保存的封面）
  function coverHtml(pic, fallback) {
    const src = coverUrl(pic);
    if (src && !failedCovers.has(src)) {
      return `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer"${fallback ? ` data-fallback="${esc(fallback)}"` : ''}>`;
    }
    return fallback && !failedCovers.has(fallback) ? `<img src="${esc(fallback)}" alt="" loading="lazy">` : ICON.film;
  }
  document.addEventListener('error', (e) => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement) || !img.parentElement || !img.parentElement.classList.contains('cover')) return;
    failedCovers.add(img.getAttribute('src'));
    const fallback = img.dataset.fallback;
    img.parentElement.innerHTML = fallback && !failedCovers.has(fallback) ? `<img src="${esc(fallback)}" alt="" loading="lazy">` : ICON.film;
  }, true);
  const store = {
    get(k) { try { return localStorage.getItem('bbdownt.' + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem('bbdownt.' + k, v); } catch {} },
  };

  const ICON = {
    film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9.5 4.5 2.5-4.5 2.5z"/></svg>',
    music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 20h14"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5v14l11-7z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/></svg>',
  };
  const VIDEO_EXT = ['mp4', 'mkv', 'flv', 'webm', 'mov', 'm4v'];
  const AUDIO_EXT = ['m4a', 'mp3', 'aac', 'flac', 'eac3', 'ec3', 'opus', 'wav'];
  const IMAGE_EXT = ['jpg', 'jpeg', 'png', 'webp', 'gif'];
  const extOf = (p) => (p.split('.').pop() || '').toLowerCase();
  // Mac 客户端（WKWebView，UA 里没有 Safari 标识）会拦截文件链接：非 inline 的链接在访达中显示文件，inline 的用默认播放器打开
  const inMacApp = /Macintosh/.test(navigator.userAgent) && /AppleWebKit/.test(navigator.userAgent) && !/Safari\//.test(navigator.userAgent);
  const baseName = (p) => p.split(/[\\/]/).pop();

  function toast(msg, isError, ms) {
    const el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => el.remove(), ms || (isError ? 5000 : 2600));
  }

  function fmtBytes(n) {
    if (!n || n < 0) return '0 B';
    const u = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + ' ' + u[i];
  }
  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    const p = (x) => String(x).padStart(2, '0');
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    return (sameDay ? '今天 ' : `${d.getMonth() + 1}月${d.getDate()}日 `) + `${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function fmtDuration(sec) {
    if (sec < 60) return sec + ' 秒';
    if (sec < 3600) return Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒';
    return Math.floor(sec / 3600) + ' 小时 ' + Math.floor((sec % 3600) / 60) + ' 分';
  }

  // ---------- API ----------
  class AuthError extends Error {}
  async function api(path, opts = {}) {
    const init = { method: opts.method || 'GET', headers: {}, credentials: 'same-origin' };
    if (opts.signal) init.signal = opts.signal;
    if (opts.body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(opts.body);
    }
    let res;
    try {
      res = await fetch(path, init);
    } catch (err) {
      if (err && err.name === 'AbortError') throw err;
      // 引擎退出或网络断开：fetch 抛出的 TypeError 在各浏览器里写法不同（Failed to fetch、Load failed）
      const e = new Error('无法连接 BBDownT 服务，请确认程序仍在运行');
      e.status = 0;
      throw e;
    }
    if (res.status === 401 && !opts.allow401) {
      showTokenModal();
      throw new AuthError('unauthorized');
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    if (!res.ok) {
      const msg = typeof data === 'string' ? data.replace(/^"|"$/g, '') : (data && (data.detail || data.title)) || ('请求失败 ' + res.status);
      const err = new Error(msg);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // ---------- token ----------
  function showTokenModal() {
    if (!$('tokenModal').hidden) return;
    stopPolling();
    $('tokenErr').textContent = '';
    $('tokenModal').hidden = false;
    setTimeout(() => $('tokenInput').focus(), 50);
  }
  $('tokenForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('tokenErr').textContent = '';
    try {
      await api('/ui/session', { method: 'POST', body: { Token: $('tokenInput').value }, allow401: true });
      $('tokenModal').hidden = true;
      $('tokenInput').value = '';
      start();
    } catch (err) {
      $('tokenErr').textContent = err.status === 401 ? '令牌不正确' : err.message;
    }

  // ---------- links ----------
  // link-rules:begin —— 只有纯函数。BBDownT.Tests/WebUi/check-link-rules.mjs 会抽出这一段，
  // 用 BBDownT.Tests/TestData/link-rules.json 核对（C# 测试用同一份数据核对 SpaceBatchDownload.IsSpaceUrl）
  const URL_RE = /https?:\/\/[^\s<>"'，。、；！？【】《》「」（）()]+/gi;
  const ID_RE = /^([Bb][Vv]1[0-9A-Za-z]{9}|[Aa][Vv]\d+|ep\d+|ss\d+|md\d+)$/;
  const CHEESE_RE = /^cheese\/(ep|ss)\d+$/;
  // 不带协议的B站链接，如 space.bilibili.com/123、www.bilibili.com/video/BV…、b23.tv/xxx
  const BARE_LINK_RE = /^(?:(?:www\.|m\.|space\.)?bilibili\.com|b23\.tv)\/[^\s<>"'，。、；！？【】《》「」（）()]*/i;
  const TRAILING_PUNCT_RE = /[.,;:!?)\]}>'"]+$/;
  const TRACKING_PARAMS = ['spm_id_from', 'vd_source', 'from_spmid', 'share_source', 'share_medium', 'share_plat',
    'share_session_id', 'share_tag', 'share_from', 'unique_k', 'bbid', 'ts', 'timestamp', 'buvid', 'is_story_h5', 'plat_id'];
  // 登录凭证参数（名称不区分大小写）：不提交，也不会写进下载历史
  const CREDENTIAL_PARAMS = ['access_key', 'access_token', 'refresh_token', 'sessdata', 'bili_jct', 'dedeuserid', 'ac_time_value'];
  // 分享文本（如「【标题】 https://b23.tv/xxx」）里只取链接：含链接的行只取其中的链接；
  // 其他行取 BV/av/ep/ss/md 号、cheese/ep123 和不带协议的B站链接（补上 https://），其余文字记为未识别（ignored）。
  // 整段都认不出时按空白拆分（与以前一致），交给服务器判断
  function splitInput(text) {
    const found = [];
    const loose = [];
    for (const line of String(text).split(/\r?\n/)) {
      const urls = line.match(URL_RE);
      if (urls) {
        found.push(...urls.map((u) => u.replace(TRAILING_PUNCT_RE, '')));
        continue;
      }
      for (const token of line.split(/\s+/).map((x) => x.trim()).filter(Boolean)) {
        const bare = BARE_LINK_RE.exec(token);
        if (ID_RE.test(token) || CHEESE_RE.test(token)) found.push(token);
        else if (bare) found.push('https://' + bare[0].replace(TRAILING_PUNCT_RE, ''));
        else loose.push(token);
      }
    }
    return found.length
      ? { links: [...new Set(found)], ignored: [...new Set(loose)] }
      : { links: [...new Set(loose)], ignored: [] };
  }
  const extractLinks = (text) => splitInput(text).links;
  // 提交给服务器的链接：去掉分享跟踪参数、登录凭证参数和 #片段
  function cleanLink(link) {
    let x;
    try { x = new URL(link); } catch { return link.trim(); }
    if (!/^https?:$/.test(x.protocol)) return link.trim();
    TRACKING_PARAMS.forEach((k) => x.searchParams.delete(k));
    [...x.searchParams.keys()].filter((k) => CREDENTIAL_PARAMS.includes(k.toLowerCase())).forEach((k) => x.searchParams.delete(k));
    x.hash = '';
    return x.toString();
  }
  const isBiliHost = (host) => host === 'bilibili.com' || host.endsWith('.bilibili.com');
  // 比较用的键（解析缓存、「所选的流」、结果是否过时）：能认出视频、番剧、课程编号时只用编号，再加上有意义的 p= 参数，
  // 所以粘贴同一视频的BV号、完整链接或分享文本得到同一个键；其他链接用 cleanLink 的结果
  function linkKey(link) {
    const s = link.trim();
    let m = /^[Bb][Vv](1[0-9A-Za-z]{9})$/.exec(s);
    if (m) return 'BV' + m[1];
    if ((m = /^[Aa][Vv](\d+)$/.exec(s))) return 'av' + m[1];
    if (/^(ep|ss|md)\d+$/.test(s) || CHEESE_RE.test(s)) return s;
    let x;
    try { x = new URL(s); } catch { return s; }
    if (!/^https?:$/.test(x.protocol)) return s;
    if (isBiliHost(x.hostname.toLowerCase())) {
      const p = x.searchParams.get('p');
      const page = p && /^\d+$/.test(p) ? '?p=' + p : '';
      const path = x.pathname;
      if ((m = /\/video\/[Bb][Vv](1[0-9A-Za-z]{9})(?:\/|$)/.exec(path))) return 'BV' + m[1] + page;
      if ((m = /\/video\/[Aa][Vv](\d+)(?:\/|$)/.exec(path))) return 'av' + m[1] + page;
      if ((m = /^\/bangumi\/play\/((ep|ss)\d+)\/?$/.exec(path))) return m[1];
      if ((m = /^\/bangumi\/media\/(md\d+)\/?$/.exec(path))) return m[1];
      if ((m = /^\/cheese\/play\/((ep|ss)\d+)\/?$/.exec(path))) return 'cheese/' + m[1];
    }
    return cleanLink(s);
  }
  // 与服务端 SpaceBatchDownload.IsSpaceUrl 相同：space.bilibili.com/数字，且不是合集/收藏夹/频道页
  function isSpaceUrl(link) {
    let x;
    try { x = new URL(link.trim()); } catch { return false; }
    if (!/^https?:$/.test(x.protocol) || x.hostname.toLowerCase() !== 'space.bilibili.com') return false;
    const parts = x.pathname.split('/').filter(Boolean);
    return parts.length > 0 && /^\d+$/.test(parts[0])
      && !parts.slice(1).some((p) => p === 'lists' || p === 'favlist' || p === 'channel');
  }
  // single：单个视频/番剧/课程单集，可自动解析；space/list/course：列表类，不自动解析；unknown：交给服务器判断
  function linkKind(link) {
    const s = link.trim();
    // 与服务端 GetAvIdAsync 一致：BV/av 不区分大小写，ep/ss 只认小写
    if (/^([Bb][Vv]1[0-9A-Za-z]{9}|[Aa][Vv]\d+|ep\d+|ss\d+)$/.test(s) || /^cheese\/ep\d+$/.test(s)) return 'single';
    if (/^cheese\/ss\d+$/.test(s)) return 'course';
    let x;
    try { x = new URL(s); } catch { return 'unknown'; }
    if (!/^https?:$/.test(x.protocol)) return 'unknown';
    const host = x.hostname.toLowerCase();
    const path = x.pathname;
    if (host === 'b23.tv') return 'single';   // 短链由服务器展开；展开后是列表时会给出说明
    if (host === 'space.bilibili.com') return isSpaceUrl(s) ? 'space' : 'list';
    if (!isBiliHost(host) && !/(^|\.)(bilibili\.tv|biliintl\.com)$/.test(host)) return 'unknown';
    if (/\/(medialist|list)\//i.test(path) || /\/channel\/(collection|series)detail/i.test(path)) return 'list';
    if (/\/cheese\/play\/ss\d+/i.test(path)) return 'course';
    if (/\/video\/(BV1[0-9A-Za-z]{9}|av\d+)/i.test(path) || /\/(bangumi|cheese)\/play\/(ep|ss)\d+/i.test(path)
      || /\/bangumi\/media\/md\d+/i.test(path) || /\/play\/\d+\/\d+/.test(path)) return 'single';
    return 'unknown';
  }
  // 页码集合压缩成 1,3-5 形式；全选时为 ALL
  function pagesExpr(set, total) {
    const xs = [...set].sort((a, b) => a - b);
    if (xs.length === total) return 'ALL';
    const out = [];
    for (let i = 0; i < xs.length; i++) {
      let j = i;
      while (j + 1 < xs.length && xs[j + 1] === xs[j] + 1) j++;
      out.push(j > i ? `${xs[i]}-${xs[j]}` : String(xs[i]));
      i = j;
    }
    return out.join(',');
  }
  // link-rules:end
  const currentInput = () => splitInput($('url').value);

  };
  const describeIgnored = (ignored) => ignored.slice(0, 3).map((t) => '「' + (t.length > 20 ? t.slice(0, 18) + '…' : t) + '」').join('、')

  function syncLinkState(input) {
